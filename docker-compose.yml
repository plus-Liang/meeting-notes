# MeetingNotes —— 一键启动
# 用法：Copy-Item .env.example .env; docker compose up -d
# 注意：
#  1) 不用 sleep 等依赖，一律 healthcheck + condition: service_healthy
#  2) 所有 ${VAR} 都有默认值，所以没有 .env 也能 `docker compose config` 通过
#  3) 国内网络：在 .env 里设 REGISTRY_PREFIX=docker.m.daocloud.io/ 再拉第三方镜像

services:
  postgres:
    image: ${REGISTRY_PREFIX:-}library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetingnotes}
      POSTGRES_USER: ${POSTGRES_USER:-mn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      # T3.0/D-067：配额日切与"明天再试"按本地时区（与 app 一致，否则埋不对称坑）
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mn} -d ${POSTGRES_DB:-meetingnotes}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REGISTRY_PREFIX:-}library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    # 多数国内加速源对非 library 镜像拒之门外；MINIO_IMAGE 可整体覆盖来源
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # minio 镜像自带 curl；若你的镜像没有，改成 mc ready local
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ASR 服务：自建 OpenAI 兼容服务（不用远程镜像 —— Hub 不通 / 加速源白名单拒绝）
  # 模型不进镜像：宿主机目录挂载到 /models（只读）；容器内固定监听 8000
  asr:
    build:
      context: ./infra/asr
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      ASR_MODEL_NAME: ${ASR_MODEL_NAME:-small}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-zh}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-1}
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
    volumes:
      # 默认 ./models（仓库根，跨平台相对路径；首次运行用 scripts/download-model.ps1 下载模型）
      - ${ASR_MODEL_HOST_DIR:-./models}:/models:ro
    ports:
      - "${ASR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    restart: unless-stopped

  # 可选：本地 LLM（第二档降级）。不启用就不加 --profile local-llm
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["local-llm"]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

  app:
    build:
      context: ./app
      args:
        # 第三方基础镜像同样走加速前缀（Dockerfile 里的 ARG REGISTRY_PREFIX）
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        # T4.72 C3：构建标识短 sha——deploy-main.ps1 注入 $env:GIT_SHA；默认 dev（不影响 CI/手动构建）
        GIT_SHA: ${GIT_SHA:-dev}
    env_file:
      # 没有 .env 也能起（全部走默认值）
      - path: .env
        required: false
    environment:
      # 容器内固定 8080（APP_PORT 只控制宿主映射端口）；否则 .env 的 APP_PORT 会同时改变
      # 容器内监听端口，造成 healthcheck(8080) 与端口映射(->8080) 双双错位、栈永远不 healthy
      APP_PORT: 8080
      # 容器内必须用服务名，不用 localhost
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meetingnotes}
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      ASR_BASE_URL: http://asr:8000
      # T3.0/D-067：与 postgres 同时区，配额日切/Retry-After 才与"本地明天"一致
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      asr:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    # T4.74/P-19：docker stop 的宽限期——必须大于 worker 排空上限（drain-timeout-sec 60s）+
    # HTTP/Bean 优雅关闭（spring.lifecycle 120s）之和的上限，否则容器先被 SIGKILL，排空形同虚设
    stop_grace_period: 180s
    healthcheck:
      # 容器内固定 8080；D-035/D-036：无 key 也必须 UP
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      # P2：inbox 目录监控（宿主目录放文件即处理）
      - ${INBOX_HOST_DIR:-./inbox}:/inbox:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
