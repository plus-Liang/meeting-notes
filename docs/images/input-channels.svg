<g fill="#1a1a1a">
<text x="486" y="44" font-size="15" font-weight="600">① 文件上传</text>
<text x="486" y="62" font-size="11">适合：文件在你手上</text>
<text x="486" y="78" font-size="11">注意：200 MB / 60 分钟</text>
<text x="486" y="126" font-size="15" font-weight="600">② 直链导入</text>
<text x="486" y="144" font-size="11">适合：文件在网盘/对象存储</text>
<text x="486" y="160" font-size="11">注意：服务端去下载，需能出网</text>
<text x="486" y="216" font-size="15" font-weight="600">③ 麦克风录音</text>
<text x="486" y="234" font-size="11">适合：本页说话</text>
<text x="486" y="250" font-size="11">注意：录不到电脑播放的声音</text>
<text x="486" y="304" font-size="15" font-weight="600">④ 录制标签页声音</text>
<text x="486" y="322" font-size="11">适合：浏览器标签页在放</text>
<text x="486" y="338" font-size="11">注意：Chrome/Edge，需勾选分享音频</text>
<text x="486" y="392" font-size="15" font-weight="600">⑤ 系统录音后上传</text>
<text x="486" y="410" font-size="11">适合：其它软件在放</text>
<text x="486" y="426" font-size="11">注意：Audacity WASAPI / 立体声混音</text>
</g>
<text x="40" y="462" font-size="12" fill="#bbb">平台页面链接（B 站 / YouTube / 抖音等）不在其列：需先下载成文件，或由部署方配置 FETCHER_CMD。</text>
