# 所有配置都从环境变量读取，默认值只用于本地开发。
# 禁止在此文件里写死任何真实 key 或本机绝对路径。

server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: meeting-notes

  jackson:
    # D-041：对外 JSON 一律 snake_case（task_id / content_hash / duration_sec / size_bytes / reused），
    # 与 webhook 契约、接入指南.md 保持一致；全局生效，不逐个手写 @JsonProperty。
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      # 上传大小硬闸放在 servlet 层（超限直接 413，磁盘不会被灌满），流内还有第二道复核
      max-file-size: ${TASK_MAX_SIZE_BYTES:209715200}
      max-request-size: ${TASK_MAX_SIZE_BYTES:209715200}

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/meetingnotes}
    username: ${DB_USER:mn}
    password: ${DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate        # 建表只走 Flyway，绝不让 Hibernate 自动建表

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  ai:
    # T1.5：收敛 Spring AI 内部重试（默认 10 次指数退避，ASR 挂掉时单次尝试要 15+ 分钟才失败，
    # 会吞掉外层 worker 的 RETRYING 状态机）。内部只试 2 次快速失败，重试语义交给 worker。
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: ${AI_RETRY_BACKOFF_INITIAL_MS:2000}
        multiplier: 2
        max-interval: ${AI_RETRY_BACKOFF_MAX_MS:10000}
    openai:
      # 三档 AI：① 云 API（填了就用）② 本地 Ollama ③ 抽取式兜底
      # 这里只配第一档；二、三档在 AiConfig 里按开关决定
      base-url: ${LLM_BASE_URL:}
      api-key: ${LLM_API_KEY:not-needed}
      chat:
        # Spring AI 1.1.x 默认 /v1/chat/completions；换供应商时用环境变量覆盖（智谱需 /chat/completions）。
        # 不要在 base-url 里手写 /v1，否则会拼出 /v1/v1/chat/completions（同 D-034 的坑）。
        completions-path: ${LLM_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${LLM_MODEL:}
          # deepseek-flash 默认开启 thinking，max-tokens 过小会让 content 为空
          max-tokens: ${LLM_MAX_TOKENS:1024}
      audio:
        transcription:
          # 契约端点：http://asr:8000/v1/audio/transcriptions
          # Spring AI 1.x 自己追加 "/v1/audio/transcriptions"，base-url 不能再带 /v1，
          # 否则实际请求会变成 /v1/v1/audio/transcriptions（404）。
          base-url: ${ASR_BASE_URL:http://asr:8000}
          api-key: ${ASR_API_KEY:not-needed}
          options:
            model: ${ASR_MODEL:small}
            # 自建 ASR 返回 {"text":"..."}；Spring AI 1.1.x 默认 response-format=text，
            # 会把整段 JSON 当成转写文本，必须显式指定 json。
            response-format: ${ASR_RESPONSE_FORMAT:json}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  offline-mode: ${OFFLINE_MODE:true}

  task:
    # D-028：单任务上限 30 → 60 分钟（真实库 45% 文件超 30 分钟），可配至 120
    max-duration-sec: ${TASK_MAX_DURATION_SEC:3600}
    max-size-bytes: ${TASK_MAX_SIZE_BYTES:209715200}
    max-retries: ${TASK_MAX_RETRIES:3}

  media:
    # 时长探测工具（容器内 apt 装的 ffmpeg 自带 ffprobe）；换路径只改环境变量（N11）
    ffprobe-bin: ${FFPROBE_BIN:ffprobe}
    # worker 抽音轨用（容器内 ffmpeg 8.0.1）
    ffmpeg-bin: ${FFMPEG_BIN:ffmpeg}

  worker:
    # Redis 任务队列键（T1.5：LPUSH 生产 / BLPOP 消费）
    queue-key: ${TASK_QUEUE_KEY:meetingnotes:task-queue}
    # BLPOP 阻塞超时，仅用于优雅停机响应；不是轮询间隔
    poll-timeout-sec: ${WORKER_POLL_TIMEOUT_SEC:10}

  asr:
    max-concurrency: ${ASR_MAX_CONCURRENCY:2}
    timeout-sec: ${ASR_TIMEOUT_SEC:900}
    # T2.2 / D-058：连接/首字节超时（停 ASR 时快速失败，不等 DNS/连接阶段挂死）
    connect-timeout-sec: ${ASR_CONNECT_TIMEOUT_SEC:5}
    max-segment-sec: ${ASR_MAX_SEGMENT_SEC:120}

  llm:
    # D-035：留空 = 由 LlmModelSwitchEnvironmentPostProcessor 按是否填了 key 自动判断；
    # 显式 true/false 可强制开关。关闭时 spring.ai.model.chat=none，chat 自动配置整体跳过。
    enabled: ${LLM_ENABLED:}
    # T3.1/D-068：chat（摘要）读超时——LLM 挂死最多拖住 worker 120s，不许吃转写的 900s
    timeout-sec: ${LLM_TIMEOUT_SEC:120}
    # 第三档兜底开关（D-020）
    fallback-extractive: ${EXTRACTIVE_FALLBACK_ENABLED:true}
    # 第二档：本地 Ollama（可选）
    ollama:
      enabled: ${OLLAMA_ENABLED:false}
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434/v1}
      model: ${OLLAMA_MODEL:}

  log-json: ${LOG_JSON:true}

  storage:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:meetingnotes}
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:true}

  security:
    api-token: ${API_TOKEN:change-me-api-token}

  quota:
    minutes-per-day: ${QUOTA_MINUTES_PER_DAY:120}
    tasks-per-day: ${QUOTA_TASKS_PER_DAY:50}

  webhook:
    url: ${WEBHOOK_URL:}
    secret: ${WEBHOOK_SECRET:}
    max-retries: ${WEBHOOK_MAX_RETRIES:3}
    timeout-sec: ${WEBHOOK_TIMEOUT_SEC:10}

  inbox:
    enabled: ${INBOX_ENABLED:false}
    dir: /inbox
    poll-sec: ${INBOX_POLL_SEC:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          # T2.4 / D-059：四项依赖进 readiness（DB/Redis 由 starter 提供，minio/asr 是自定义指标）
          include: readinessState,db,redis,minio,asr

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.meetingnotes: ${LOG_LEVEL:INFO}
