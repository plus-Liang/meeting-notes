# 所有配置都从环境变量读取，默认值只用于本地开发。
# 禁止在此文件里写死任何真实 key 或本机绝对路径。

server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: meeting-notes

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/meetingnotes}
    username: ${DB_USER:mn}
    password: ${DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate        # 建表只走 Flyway，绝不让 Hibernate 自动建表

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  ai:
    openai:
      # 三档 AI：① 云 API（填了就用）② 本地 Ollama ③ 抽取式兜底
      # 这里只配第一档；二、三档在 AiConfig 里按开关决定
      base-url: ${LLM_BASE_URL:}
      api-key: ${LLM_API_KEY:not-needed}
      chat:
        options:
          model: ${LLM_MODEL:}
      audio:
        transcription:
          # 契约端点：http://asr:8000/v1/audio/transcriptions
          # Spring AI 1.x 自己追加 "/v1/audio/transcriptions"，base-url 不能再带 /v1，
          # 否则实际请求会变成 /v1/v1/audio/transcriptions（404）。
          base-url: ${ASR_BASE_URL:http://asr:8000}
          api-key: ${ASR_API_KEY:not-needed}
          options:
            model: ${ASR_MODEL:small}
            # 自建 ASR 返回 {"text":"..."}；Spring AI 1.1.x 默认 response-format=text，
            # 会把整段 JSON 当成转写文本，必须显式指定 json。
            response-format: ${ASR_RESPONSE_FORMAT:json}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  offline-mode: ${OFFLINE_MODE:true}

  task:
    max-duration-sec: ${TASK_MAX_DURATION_SEC:1800}
    max-size-bytes: ${TASK_MAX_SIZE_BYTES:209715200}
    max-retries: ${TASK_MAX_RETRIES:3}

  asr:
    max-concurrency: ${ASR_MAX_CONCURRENCY:2}
    timeout-sec: ${ASR_TIMEOUT_SEC:900}
    max-segment-sec: ${ASR_MAX_SEGMENT_SEC:120}

  llm:
    # 第三档兜底开关（D-020）
    fallback-extractive: ${EXTRACTIVE_FALLBACK_ENABLED:true}
    # 第二档：本地 Ollama（可选）
    ollama:
      enabled: ${OLLAMA_ENABLED:false}
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434/v1}
      model: ${OLLAMA_MODEL:}

  log-json: ${LOG_JSON:true}

  storage:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:meetingnotes}
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:true}

  security:
    api-token: ${API_TOKEN:change-me-api-token}

  quota:
    minutes-per-day: ${QUOTA_MINUTES_PER_DAY:120}
    tasks-per-day: ${QUOTA_TASKS_PER_DAY:50}

  webhook:
    url: ${WEBHOOK_URL:}
    secret: ${WEBHOOK_SECRET:}
    max-retries: ${WEBHOOK_MAX_RETRIES:3}
    timeout-sec: ${WEBHOOK_TIMEOUT_SEC:10}

  inbox:
    enabled: ${INBOX_ENABLED:false}
    dir: /inbox
    poll-sec: ${INBOX_POLL_SEC:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.meetingnotes: ${LOG_LEVEL:INFO}
