# 所有配置都从环境变量读取，默认值只用于本地开发。
# 禁止在此文件里写死任何真实 key 或本机绝对路径。

server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: meeting-notes

  jackson:
    # D-041：对外 JSON 一律 snake_case（task_id / content_hash / duration_sec / size_bytes / reused），
    # 与 webhook 契约、接入指南.md 保持一致；全局生效，不逐个手写 @JsonProperty。
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      # 上传大小硬闸放在 servlet 层（超限直接 413，磁盘不会被灌满），流内还有第二道复核
      max-file-size: ${TASK_MAX_SIZE_BYTES:209715200}
      # T4.7：请求总体积上限改用批量键（原 200MB 会卡 20 文件批量）；单文件仍受上面 max-file-size 硬闸。
      # 超限 → MaxUploadSizeExceededException → 413 SIZE_EXCEEDED（引擎层拦截）
      max-request-size: ${TASK_BATCH_MAX_SIZE_BYTES:2147483648}

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/meetingnotes}
    username: ${DB_USER:mn}
    password: ${DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate        # 建表只走 Flyway，绝不让 Hibernate 自动建表

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  ai:
    # T1.5：收敛 Spring AI 内部重试（默认 10 次指数退避，ASR 挂掉时单次尝试要 15+ 分钟才失败，
    # 会吞掉外层 worker 的 RETRYING 状态机）。内部只试 2 次快速失败，重试语义交给 worker。
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: ${AI_RETRY_BACKOFF_INITIAL_MS:2000}
        multiplier: 2
        max-interval: ${AI_RETRY_BACKOFF_MAX_MS:10000}
    openai:
      # 三档 AI：① 云 API（填了就用）② 本地 Ollama ③ 抽取式兜底
      # 这里只配第一档；二、三档在 AiConfig 里按开关决定
      base-url: ${LLM_BASE_URL:}
      api-key: ${LLM_API_KEY:not-needed}
      chat:
        # Spring AI 1.1.x 默认 /v1/chat/completions；换供应商时用环境变量覆盖（智谱需 /chat/completions）。
        # 不要在 base-url 里手写 /v1，否则会拼出 /v1/v1/chat/completions（同 D-034 的坑）。
        completions-path: ${LLM_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${LLM_MODEL:}
          # deepseek-flash 默认开启 thinking，max-tokens 过小会让 content 为空
          # F-8（D-071）：默认 8192——推理模型的思考链吃 token，1024 必空、4096 不稳
          max-tokens: ${LLM_MAX_TOKENS:8192}
          # T4.16b（D-107）：同内容两次结构化结果乱跳（待办 0 vs 5、摘要相似度 0.47）→
          # 云档固定贪心解码（0.0）；要采样式多样性时用环境变量覆盖
          temperature: ${LLM_TEMPERATURE:0.0}
      audio:
        transcription:
          # 契约端点：http://asr:8000/v1/audio/transcriptions
          # Spring AI 1.x 自己追加 "/v1/audio/transcriptions"，base-url 不能再带 /v1，
          # 否则实际请求会变成 /v1/v1/audio/transcriptions（404）。
          base-url: ${ASR_BASE_URL:http://asr:8000}
          api-key: ${ASR_API_KEY:not-needed}
          options:
            model: ${ASR_MODEL:small}
            # 自建 ASR 返回 {"text":"..."}；Spring AI 1.1.x 默认 response-format=text，
            # 会把整段 JSON 当成转写文本，必须显式指定 json。
            response-format: ${ASR_RESPONSE_FORMAT:json}

  task:
    scheduling:
      pool:
        # T4.67 S7：@Scheduled 默认单线程——StalePendingSweeper 在 Redis 半死时单条投递可阻塞
        # 60s（Lettuce command-timeout），会拖停同池的 webhook 到期扫描（fixedDelay=1000）。
        # 调度池扩到 4，隔离两类周期任务。
        size: 4

  web:
    resources:
      cache:
        cachecontrol:
          # T4.68 C1（D-211/K-137）：静态资源此前只发 Last-Modified、没有 Cache-Control，
          # 浏览器按启发式缓存长期保留旧 CSS/HTML →「代码改了、部署对了，用户还是旧界面」。
          # no-cache = 每次用条件请求校验：未变 304（不重传体积），变了立刻拿新。
          # 不改静态文件 URL 形式（不做手写版本号）。
          no-cache: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  offline-mode: ${OFFLINE_MODE:true}

  task:
    # D-028：单任务上限 30 → 60 分钟（真实库 45% 文件超 30 分钟），可配至 120
    max-duration-sec: ${TASK_MAX_DURATION_SEC:3600}
    max-size-bytes: ${TASK_MAX_SIZE_BYTES:209715200}
    max-retries: ${TASK_MAX_RETRIES:3}

  limits:
    # T4.7 批量提交（US-8 / 需求确认单 D2：上限 20）。TASK_BATCH_MAX_SIZE_BYTES 消费方在
    # spring.servlet.multipart.max-request-size（见上）；本段只放 app 代码直接读的两键
    batch-max-files: ${BATCH_MAX_FILES:20}
    # 预估耗时系数（只是预估不承诺）：estimated_sec = round(total_duration_sec * rtf + accepted * 2)
    batch-estimate-rtf: ${BATCH_ESTIMATE_RTF:0.15}

  media:
    # 时长探测工具（容器内 apt 装的 ffmpeg 自带 ffprobe）；换路径只改环境变量（N11）
    ffprobe-bin: ${FFPROBE_BIN:ffprobe}
    # worker 抽音轨用（容器内 ffmpeg 8.0.1）
    ffmpeg-bin: ${FFMPEG_BIN:ffmpeg}

  share:
    # T4.28：只读分享链接有效期（天）；token 明文永不落库（DB 只存 SHA256 hex）
    ttl-days: ${SHARE_TTL_DAYS:7}

  audio:
    # T4.35b：播放器短时签名音频 URL 有效期（秒）；签名 = HMAC-SHA256(key=API_TOKEN, taskId+"\n"+exp)，
    # 绑定 taskId 与 exp；URL 可分享但只读、短时。GET /tasks/{id}/audio 免 Bearer 只认签名
    token-ttl-sec: ${AUDIO_TOKEN_TTL_SEC:600}

  fetch:
    # T4.32a：链接导入（FETCH 直链），安全口径与已知限制见接入指南 §3.9
    max-redirects: ${FETCH_MAX_REDIRECTS:5}
    connect-timeout-ms: ${FETCH_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${FETCH_READ_TIMEOUT_MS:10000}
    max-bytes: ${FETCH_MAX_BYTES:209715200}
    # 逗号分隔主机白名单：命中则跳过内网 IP 拦截（SSRF 防护被绕过！）——仅自测/受信内网部署，生产必须留空
    allow-hosts: ${FETCH_ALLOW_HOSTS:}
    # T4.32b：预览只读响应体前 N 字节（解析 og 元信息用），不整页进内存
    preview-max-bytes: ${FETCH_PREVIEW_MAX_BYTES:2097152}
    # T4.32b：BYOF 外部抓取工具命令（默认空 = 未配置，use_byof 请求 → 400 FETCHER_UNAVAILABLE）；
    # 按空格拆 argv 不过 shell，{url} 必填（独立元素），{out} 可选；仓库不含平台解析器（D-027R）
    fetcher-cmd: ${FETCHER_CMD:}
    fetcher-timeout-ms: ${FETCHER_TIMEOUT_MS:120000}

  queue:
    pending-sweep:
      # T4.67 S3：运行期陈旧 PENDING 周期清扫（StalePendingSweeper）配置。
      # enabled=false 为故障止血开关（完全关闭清扫）；stale-minutes 与启动恢复共用单一来源
      # （StalePendingQueries.DEFAULT_STALE_MINUTES，默认 2 分钟）；interval-ms 为两轮间隔。
      enabled: ${APP_QUEUE_PENDING_SWEEP_ENABLED:true}
      stale-minutes: ${APP_QUEUE_PENDING_SWEEP_STALE_MINUTES:2}
      interval-ms: ${APP_QUEUE_PENDING_SWEEP_INTERVAL_MS:60000}

  worker:
    # Redis 任务队列键（T1.5：LPUSH 生产 / BLPOP 消费）
    queue-key: ${TASK_QUEUE_KEY:meetingnotes:task-queue}
    # BLPOP 阻塞超时，仅用于优雅停机响应；不是轮询间隔
    poll-timeout-sec: ${WORKER_POLL_TIMEOUT_SEC:10}

  asr:
    max-concurrency: ${ASR_MAX_CONCURRENCY:2}
    timeout-sec: ${ASR_TIMEOUT_SEC:900}
    # T2.2 / D-058：连接/首字节超时（停 ASR 时快速失败，不等 DNS/连接阶段挂死）
    connect-timeout-sec: ${ASR_CONNECT_TIMEOUT_SEC:5}
    max-segment-sec: ${ASR_MAX_SEGMENT_SEC:120}

  llm:
    # D-035：留空 = 由 LlmModelSwitchEnvironmentPostProcessor 按是否填了 key 自动判断；
    # 显式 true/false 可强制开关。关闭时 spring.ai.model.chat=none，chat 自动配置整体跳过。
    enabled: ${LLM_ENABLED:}
    # T3.1/D-068：chat（摘要）读超时——LLM 挂死最多拖住 worker 120s，不许吃转写的 900s
    timeout-sec: ${LLM_TIMEOUT_SEC:120}
    # 第三档兜底开关（D-020）
    fallback-extractive: ${EXTRACTIVE_FALLBACK_ENABLED:true}
    # T4.18/D-109：转写 AI 加标点的长度上限（字）——transcript 非空且 ≤ 此值才追加独立标点调用；
    # 0 = 关闭标点；超限/失败 → transcript_punctuated 留 null，任务仍 DONE
    punctuate-max-chars: ${LLM_PUNCTUATE_MAX_CHARS:6000}
    # 第二档：本地 Ollama（可选）
    ollama:
      enabled: ${OLLAMA_ENABLED:false}
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434/v1}
      model: ${OLLAMA_MODEL:}
      # T3.11/D-081：本地档独立预算（云档仍是 max-tokens 8192 / timeout 120s，一个字不改）
      max-tokens: ${LLM_LOCAL_MAX_TOKENS:512}
      timeout-sec: ${LLM_LOCAL_TIMEOUT_SEC:180}

  log-json: ${LOG_JSON:true}

  storage:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:meetingnotes}
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:true}

  security:
    api-token: ${API_TOKEN:change-me-api-token}

  auth:
    # T4.37a：开放注册开关（1 号管理员的首次注册认领不受此开关限制）
    # false → POST /api/v1/auth/register 对非认领路径回 403 REGISTRATION_DISABLED
    registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}

  quota:
    minutes-per-day: ${QUOTA_MINUTES_PER_DAY:120}
    tasks-per-day: ${QUOTA_TASKS_PER_DAY:50}

  webhook:
    url: ${WEBHOOK_URL:}
    secret: ${WEBHOOK_SECRET:}
    max-retries: ${WEBHOOK_MAX_RETRIES:3}
    timeout-sec: ${WEBHOOK_TIMEOUT_SEC:10}

  inbox:
    enabled: ${INBOX_ENABLED:false}
    dir: /inbox
    poll-sec: ${INBOX_POLL_SEC:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          # T2.4 / D-059：四项依赖进 readiness（DB/Redis 由 starter 提供，minio/asr 是自定义指标）
          include: readinessState,db,redis,minio,asr

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.meetingnotes: ${LOG_LEVEL:INFO}
