<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="查看转写任务：按状态筛选，进行中任务自动刷新，失败任务可批量重试。">
<title>任务台账 · 录音纪要平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E%E2%96%B6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="docket">
    <b>REC-NOTES</b><span>自托管 · 私有部署</span>
    <span class="r">
      <span id="docketCounts">—</span>
      <span id="docketDate">—</span>
      <span>V0.1.0</span>
    </span>
  </div>

  <header class="top">
    <a class="brand" href="index.html">录音纪要平台<em>transcript &amp; minutes</em></a>
    <nav class="nav">
      <a href="index.html">提交</a>
      <a href="tasks.html" aria-current="page">任务台账</a>
      <a href="settings.html">设置</a>
    </nav>
    <span class="who mn-userbar" data-mn-userbar></span>
  </header>

  <section class="mast">
    <h1>任务台账</h1>
    <dl class="meta">
      <div><dt>全部</dt><dd class="big" id="mastTotal">—</dd></div>
      <div><dt>进行中</dt><dd id="mastActive">—</dd></div>
      <div><dt>已完成</dt><dd id="mastDone">—</dd></div>
      <div><dt>失败</dt><dd id="mastDead">—</dd></div>
    </dl>
  </section>

  <main>
    <div class="search-box">
      <input type="search" id="searchInput" maxlength="100" placeholder="按文件名或任务编号搜索" aria-label="搜索任务（服务端搜索）">
      <p class="search-note" id="searchNote"></p>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="active-chips" id="activeChips"></div> <!-- T4.42：已选条件胶囊（可单个移除）+ 清除筛选 -->
    <div class="retry-bar" id="retryBar" style="display:none;">
      <label><input type="checkbox" id="checkAll"> 全选当前筛选</label> <!-- T4.53 缺陷3：全选=当前筛选内全部 -->
      <span class="batch-actions">
        <button id="batchRetryBtn" class="btn-secondary">批量重试</button>
        <button id="exportBtn" class="btn-secondary">导出选中 Markdown</button>
        <button id="deleteBtn" class="btn-danger">删除所选</button>
        <button id="deleteFailedBtn" class="btn-danger">清空失败任务</button>
      </span>
      <span id="selHint" class="hint"></span>
      <span id="retryResult" class="hint"></span>
    </div>
    <p class="result-count" id="resultCount" style="display:none;"></p> <!-- T4.42：共 N 条 · 已加载 M 条 -->
    <div id="list" aria-live="polite">
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:45%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:60%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:38%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:52%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:30%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
    </div>
    <p><button id="moreBtn" class="btn-secondary" style="display:none;">加载更多</button></p>
  </main>

  <footer class="site-footer">
    <span>私有部署 · 数据只在你自己的服务器</span>
    <a href="https://github.com/plus-Liang/meeting-notes" rel="noopener">GitHub</a>
    <span>录音纪要平台 · 白纸档案</span>
  </footer>
</div>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="confirm.js"></script>
    <script src="drawer.js"></script>
<script>
(function () {
  var listEl = document.getElementById('list');
  var filterBar = document.getElementById('filterBar');
  var retryBar = document.getElementById('retryBar');
  var checkAllEl = document.getElementById('checkAll');
  var retryBtn = document.getElementById('batchRetryBtn');
  var retryResult = document.getElementById('retryResult');
  var moreBtn = document.getElementById('moreBtn');
  var exportBtn = document.getElementById('exportBtn'); /* T4.15⑥ */
  var deleteBtn = document.getElementById('deleteBtn'); /* T4.21 */
  var deleteFailedBtn = document.getElementById('deleteFailedBtn'); /* T4.21 */
  var searchInput = document.getElementById('searchInput'); /* T4.15④ */
  var timer = null;
  var lastRenderKey = null;
  var state = { filter: '', cursor: null, items: [], checked: {}, checkedCount: 0, search: '',
    filterFavorite: false, filterLabels: [], range: '', total: null,
    selectAll: false, excluded: {} }; /* T4.42：标签/时间范围/total；T4.53 缺陷3：全选=筛选内全部；
    T4.56：全选态下被单独取消的行进 excluded（勾选框表达"排除"，不再写 checked/计数） */

  /* 清空选择（含全选态与排除集）：筛选变化 / 动作完成后的统一入口（T4.53 缺陷3 + T4.56 excluded） */
  function clearSelection() {
    state.checked = {};
    state.checkedCount = 0;
    state.selectAll = false;
    state.excluded = {};
  }

  /* T4.56：按钮禁用判据与 resolveSelectedIds() 同源——"实际可执行集合是否为空"（严格 > 0）。
     全选态用 total - 排除数；非全选态用勾选数。total 拿不到时全选态不视为可选（render 已禁全选框）。 */
  function hasSelection() {
    if (state.selectAll) {
      if (state.total === null) { return false; }
      return state.total - Object.keys(state.excluded).length > 0;
    }
    return state.checkedCount > 0;
  }
  /* T4.24：状态计数改调 GET /tasks/counts（服务端真计数无上限；页面可见时 30s 刷新保留） */
  var countState = { total: null, active: 0, done: 0, dead: 0 };

  /* 筛选状态：'' 全部 / ACTIVE 进行中（前端合并三个状态，后端单值契约不变）/ DONE / DEAD */
  var FILTERS = [
    { key: '', label: '全部' },
    { key: 'ACTIVE', label: '进行中' },
    { key: 'DONE', label: '已完成' },
    { key: 'DEAD', label: '失败' }
  ];

  /* ===== T4.42：时间范围（后端 created_after/created_before，服务端时区半开区间） ===== */
  var RANGES = [
    { key: '', label: '全部' },
    { key: 'today', label: '今天' },
    { key: '7d', label: '近 7 天' },
    { key: '30d', label: '近 30 天' }
  ];

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function dateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  /* range → API 参数：今天 = [today, today]（before 解释为次日 00:00 半开）；
     近 7/30 天 = 含今天倒推 N-1 天，只设 after（未来侧不设界） */
  function rangeDates(key) {
    var now = new Date();
    if (key === 'today') return { after: dateStr(now), before: dateStr(now) };
    if (key === '7d' || key === '30d') {
      var d = new Date(now);
      d.setDate(d.getDate() - (key === '7d' ? 6 : 29));
      return { after: dateStr(d), before: '' };
    }
    return { after: '', before: '' };
  }

  /* T4.42：筛选状态 ⇄ URL（range/status/label×N/favorite/q；before_id 游标不写 URL）。
     非法值（未知 range/status）回退默认并标记 invalid → 开场 toast，不白屏 */
  function parseUrlFilters() {
    var sp = new URLSearchParams(location.search);
    var invalid = false;
    var range = sp.get('range') || '';
    if (range && !RANGES.some(function (r) { return r.key === range; })) { invalid = true; range = ''; }
    var status = sp.get('status') || '';
    if (status && !FILTERS.some(function (f) { return f.key === status; })) { invalid = true; status = ''; }
    var labels = [], labelsInvalid = false;
    sp.getAll('label').map(function (s) { return String(s).trim(); }).forEach(function (s) {
      if (!s) return;
      if (s.length > 20) { labelsInvalid = true; return; } /* T4.42 缺陷修复④：超长不静默丢，走 invalid toast */
      labels.push(s);
    });
    var favorite = sp.get('favorite') === 'true';
    var q = (sp.get('q') || '').trim();
    if (q.length > 100) q = q.slice(0, 100);
    return { range: range, status: status, labels: labels, favorite: favorite, q: q,
      invalid: invalid || labelsInvalid };
  }

  function syncUrl() {
    var sp = new URLSearchParams();
    if (state.range) sp.set('range', state.range);
    if (state.filter) sp.set('status', state.filter);
    state.filterLabels.forEach(function (l) { sp.append('label', l); });
    if (state.filterFavorite) sp.set('favorite', 'true');
    if (state.search) sp.set('q', state.search);
    var qs = sp.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  }

  /* localStorage：仅作"上次提交"的名称缓存与服务不可用时的兜底展示 */
  function localName(id) {
    var hit = loadTaskIndex().filter(function (item) { return item.id === id; })[0];
    return hit ? hit.name : null;
  }

  /* T4.41：台账行 = 编号 / 文件名+模板·标签 / 时长 / 提交时间 / 状态圆点 / 详情（原字段口径不变） */
  var TEMPLATE_SHORT = { meeting: '会议', course: '课程', interview: '访谈', podcast: '播客', shortvideo: '短视频' };

  function stDotClass(status) {
    if (status === 'DONE') return 'dot-ok';
    if (status === 'DEAD' || status === 'RETRYING') return 'dot-bad';
    if (status === 'PENDING') return 'dot-wait';
    return 'dot-go';
  }

  function identityHtml(item) {
    var html = '';
    if (item.template && TEMPLATE_SHORT[item.template]) {
      html += '<span class="badge tpl">' + TEMPLATE_SHORT[item.template] + '</span>';
    }
    if (item.labels && item.labels.length) {
      html += item.labels.map(function (l) {
        return '<span class="chip plain">' + escapeHtml(l) + '</span>';
      }).join('');
    }
    if (item.keywords && item.keywords.length) {
      html += item.keywords.slice(0, 3).map(function (k) {
        return '<span class="chip plain kchip">' + escapeHtml(k) + '</span>';
      }).join('');
      if (item.keywords.length > 3) {
        html += ' <span class="chip plain kchip">+' + (item.keywords.length - 3) + '</span>';
      }
    }
    return html;
  }

  function summaryHtml(item) {
    return item.summary_head
      ? '<span class="task-summary">' + escapeHtml(item.summary_head) + '…</span>'
      : '';
  }

  /* ===== T4.43：展示名规则 = display_name || 清洗文件名 =====
     清洗 = 去常见音视频/字幕扩展名、>60 字截断加省略号；纯 uuid/hash 名不特殊处理（由用户重命名解决）。
     原文件名与溯源不动（display_name 是 task 表独立展示列，V9）。 */
  var MEDIA_EXT_RE = /\.(mp3|wav|m4a|m4v|aac|ogg|oga|opus|flac|webm|mp4|mov|mkv|avi|wmv|amr|wma|3gp|srt|ass|ssa|txt|md)(\.(tmp|part|temp))?$/i;
  function cleanFileName(raw) {
    if (!raw) return '';
    var n = String(raw).replace(MEDIA_EXT_RE, '');
    return n.length > 60 ? n.slice(0, 60) + '…' : n;
  }
  function displayTitle(item) {
    return item.display_name || cleanFileName(item.original_name) || localName(item.id) || ('任务 ' + item.id);
  }

  function fmtClockShort(iso) {
    if (!iso) return '—';
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '—';
      var p = function (n) { return n < 10 ? '0' + n : String(n); };
      return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return '—'; }
  }

  function renderFilterBar() {
    /* T4.42：状态 segs + 时间范围 segs + 收藏 + 标签多选（下拉复选，值由 state 保持防重建丢失） */
    var rangeBtns = RANGES.map(function (r) {
      return '<button class="filter-btn' + (state.range === r.key ? ' active' : '') +
        '" data-range="' + r.key + '" aria-pressed="' + (state.range === r.key) + '">' + r.label + '</button>';
    }).join('');
    var fav = '<button class="filter-btn' + (state.filterFavorite ? ' active' : '') +
      '" id="favoriteFilterBtn" type="button" aria-pressed="' + state.filterFavorite + '">★ 收藏</button>';
    var picked = state.filterLabels.length;
    var labelBtn = '<span class="label-multi"><button class="filter-btn' + (picked ? ' active' : '') +
      '" id="labelMultiBtn" type="button" aria-expanded="false" aria-haspopup="true">标签' +
      (picked ? ' · ' + picked : '') + '▾</button><span class="label-pop" id="labelPop" hidden></span></span>';
    var statusBtns = FILTERS.map(function (f) {
      var n = countFor(f.key);
      return '<button class="filter-btn' + (state.filter === f.key ? ' active' : '') +
        '" data-status="' + f.key + '" aria-pressed="' + (state.filter === f.key) + '">' + f.label +
        (n === null ? '' : '<span class="count-chip">' + n + '</span>') + '</button>';
    }).join('');
    filterBar.innerHTML = rangeBtns + statusBtns + fav + labelBtn;
    refreshLabelOptions();
  }

  /* T4.29b→T4.42（K-81）：标签选项 = 当前已加载行的 labels 并集；筛选中的标签不在当前页时保留占位，
     防「下拉显示全部标签但筛选仍生效」的卡死。多选复选框不重建弹层，选中态即时同步 */
  function refreshLabelOptions() {
    var pop = document.getElementById('labelPop');
    if (!pop) return;
    var seen = {}, labels = [];
    state.items.forEach(function (i) {
      (i.labels || []).forEach(function (l) {
        if (!seen[l]) { seen[l] = true; labels.push(l); }
      });
    });
    state.filterLabels.forEach(function (l) {
      if (labels.indexOf(l) < 0) labels.unshift(l);
    });
    if (!labels.length) {
      pop.innerHTML = '<span class="label-hint">暂无标签（在详情页可给任务添加）</span>';
      return;
    }
    pop.innerHTML = labels.map(function (l) {
      var on = state.filterLabels.indexOf(l) >= 0;
      return '<label class="label-opt"><input type="checkbox" class="label-opt-box" value="' +
        escapeAttr(l) + '"' + (on ? ' checked' : '') + '>' + escapeHtml(l) + '</label>';
    }).join('');
  }

  /* T4.24：各状态计数（服务端真计数；计数口径 = /tasks/counts 的 GROUP BY，无 200 上限） */
  function countFor(key) {
    if (countState.total === null) return null;
    if (key === '') return String(countState.total);
    if (key === 'ACTIVE') return String(countState.active);
    if (key === 'DONE') return String(countState.done);
    return String(countState.dead);
  }

  function fillMeta() {
    function set(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
    if (countState.total !== null) {
      set('mastTotal', String(countState.total));
      set('mastActive', String(countState.active));
      set('mastDone', String(countState.done));
      set('mastDead', String(countState.dead));
      set('docketCounts', '归档 ' + countState.total);
    }
  }

  function fetchCounts() {
    getJson('api/v1/tasks/counts').then(function (data) {
      if (data.__httpStatus !== 200) return;
      countState = { total: data.total, active: data.active, done: data.done, dead: data.dead };
      fillMeta();
      renderFilterBar();
    }, function () { /* 计数失败不打扰主列表 */ });
  }

  /* 页面可见时每 30 秒刷新计数（D-024 精神：轮询只在可见时进行；T4.24 起为服务端真计数） */
  setInterval(function () {
    if (document.visibilityState === 'visible') fetchCounts();
  }, 30000);

  /* 拉一页：ACTIVE 合并三个状态（各自 limit=50 第一页，前端去重排序）；其余走单状态 + 游标。
     T4.24：搜索关键词带 q 参数走服务端（不再本地过滤已加载行）
     T4.42：favorite/多标签/时间范围参数化透传（与 status/q 可组合），total 聚合回传 */
  function filterParams() {
    var p = state.filterFavorite ? '&favorite=true' : '';
    state.filterLabels.forEach(function (l) { p += '&label=' + encodeURIComponent(l); });
    var d = rangeDates(state.range);
    if (d.after) p += '&created_after=' + d.after;
    if (d.before) p += '&created_before=' + d.before;
    return p;
  }

  function fetchPage(cursor) {
    var q = state.search ? '&q=' + encodeURIComponent(state.search) : '';
    var meta = filterParams();
    if (state.filter === 'ACTIVE') {
      return Promise.all(['PENDING', 'RUNNING', 'RETRYING'].map(function (s) {
        return getJson('api/v1/tasks?status=' + s + '&limit=50' + q + meta);
      })).then(function (results) {
        var seen = {}, merged = [], total = 0;
        results.forEach(function (r) {
          if (typeof r.total === 'number') total += r.total;
          (r.items || []).forEach(function (item) {
            if (!seen[item.id]) { seen[item.id] = true; merged.push(item); }
          });
        });
        merged.sort(function (a, b) { return b.id - a.id; });
        /* __httpStatus: 200 必须带上——loadFirst 以它判定成功（T4.42 首跑踩过：缺了会误走失败态） */
        return { items: merged, next_before_id: null, total: total, __httpStatus: 200 };
      });
    }
    var url = 'api/v1/tasks?limit=20' +
      (state.filter ? '&status=' + state.filter : '') + q + meta +
      (cursor ? '&before_id=' + cursor : '');
    return getJson(url);
  }

  function rowHtml(item) {
    var name = displayTitle(item);
    /* T4.29：星标 + 标签 chips（favorite/labels 为列表接口只增字段） */
    var star = item.favorite ? '<span class="fav-star" title="已收藏">★</span>' : '';
    var checkbox = '<span class="row-check-cell"><input type="checkbox" class="row-check" data-id="' + item.id + '"' +
      ((state.selectAll ? !state.excluded[item.id] : !!state.checked[item.id]) ? ' checked' : '') +
      ' aria-label="选择任务 #' + item.id + '"></span>'; /* T4.56：全选态勾选框反映操作集合（未排除=勾上）；勾选不再限于 DEAD */
    return '<div class="task-row" data-id="' + item.id + '">' +
      checkbox +
      '<span class="task-no">#' + item.id + '</span>' +
      '<span class="task-name">' + star +
      '<span class="task-title"><a href="task.html?id=' + item.id + '" class="task-detail-link" data-task-id="' + item.id +
      '" data-task-name="' + escapeHtml(name).replace(/"/g, '&quot;') + '" ' +
      'aria-label="查看任务 #' + item.id + ' 详情">' + escapeHtml(name) + '</a></span>' +
      '<span class="task-sub">' + identityHtml(item) + '</span>' +
      summaryHtml(item) + '</span>' +
      '<span class="cell-num cell-dur">' + fmtDuration(item.duration_sec) + '</span>' +
      '<span class="cell-num cell-time">' + fmtClockShort(item.created_at) + '</span>' +
      '<span class="st"><i class="st-dot ' + stDotClass(item.status) + '"></i>' + statusText(item.status) + '</span>' +
      '<span class="task-side"><a href="task.html?id=' + item.id + '" class="task-detail-link" data-task-id="' + item.id +
      '" data-task-name="' + escapeHtml(name).replace(/"/g, '&quot;') + '" ' +
      'aria-label="查看任务 #' + item.id + ' 详情">详情</a>' +
      '<button type="button" class="linkish js-rename" data-rename-id="' + item.id + '"' +
      ' aria-label="重命名任务 #' + item.id + '">重命名</button></span></div>';
  }

  var EMPTY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M22 8v6a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

  function emptyHtml() {
    return '<div class="empty-state">' + EMPTY_ICON +
      '<h2 class="empty-title">这里还没有任务</h2><p>换一个筛选条件，或提交第一个音/视频文件开始转写。</p>' +
      '<a class="btn-secondary" href="index.html">去提交文件</a></div>';
  }

  /* T4.42：有筛选但 0 条 → 无结果态（可就地清除筛选）；与「还没有任务」空态区分 */
  function noResultHtml() {
    return '<div class="empty-state">' + EMPTY_ICON +
      '<h2 class="empty-title">没有匹配的结果</h2><p>当前筛选组合下没有任务，试着放宽条件。</p>' +
      '<button type="button" class="btn-secondary js-clear-filters">清除筛选</button></div>';
  }

  function emptyOfflineHtml() {
    return '<div class="empty-state">' + EMPTY_ICON +
      '<h2 class="empty-title">服务暂时不可用</h2><p>请确认服务端已启动，然后刷新重试。</p>' +
      '<a class="btn-secondary" href="tasks.html">刷新重试</a></div>';
  }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* T4.42 缺陷修复②：拼进 HTML **属性**的值一律走 escapeAttr（在 escapeHtml 上再转引号），
     防 `?label=x" onfocus=alert(1)` 这类合法标签（后端 1–20 字任意字符）击穿属性 */
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ===== T4.42：日期分组（今天 / 昨天 / 本周 / 更早；周一起算；未来时间归入今天） ===== */
  function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function dateGroupOf(iso) {
    if (!iso) return '更早';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '更早';
    var today = dayStart(new Date()), that = dayStart(d);
    var diff = Math.round((today - that) / 86400000);
    if (diff <= 0) return '今天';
    if (diff === 1) return '昨天';
    var weekStart = new Date(today);
    weekStart.setDate(weekStart.getDate() - ((today.getDay() + 6) % 7)); /* 周一为一周起点 */
    return that >= weekStart ? '本周' : '更早';
  }

  function groupedRowsHtml() {
    var html = '', last = null;
    state.items.forEach(function (item) {
      var g = dateGroupOf(item.created_at);
      if (g !== last) { html += '<div class="group-head">' + g + '</div>'; last = g; }
      html += rowHtml(item);
    });
    return html;
  }

  /* 无变化不重绘（避免 3s 轮询整块闪烁）；勾选/重试等本地状态变化仍走 render() */
  function renderKey() {
    return state.filter + '|' + state.filterFavorite + '|' + state.filterLabels.join(',') + '|' +
      state.range + '|' + state.total + '|' + state.search + '|' +
      state.items.map(function (i) { return i.id + ':' + i.status; }).join(',');
  }

  /* T4.42：是否有生效筛选（决定空态/无结果两种呈现） */
  function hasActiveFilters() {
    return !!(state.search || state.filter || state.filterLabels.length || state.range || state.filterFavorite);
  }

  /* ===== T4.42：已选条件胶囊（可单个移除）+ 清除筛选 =====
     缺陷修复③：值走 data-clear-value（escapeAttr），JS 用 dataset 读取——不再用分隔符切割，
     标签含 `:`（如「会议:复盘」）也能正确移除 */
  function chipHtml(kind, arg, text) {
    return '<span class="chip"><span class="chip-text">' + escapeHtml(text) + '</span>' +
      '<button type="button" class="chip-x" data-clear-kind="' + kind + '"' +
      (arg !== null ? ' data-clear-value="' + escapeAttr(arg) + '"' : '') +
      ' aria-label="移除筛选：' + escapeAttr(text) + '">×</button></span>';
  }

  function renderActiveChips() {
    var chips = '';
    if (state.range) {
      var r = RANGES.filter(function (x) { return x.key === state.range; })[0];
      chips += chipHtml('range', null, '时间 · ' + (r ? r.label : state.range));
    }
    if (state.filter) {
      var f = FILTERS.filter(function (x) { return x.key === state.filter; })[0];
      chips += chipHtml('status', null, '状态 · ' + (f ? f.label : state.filter));
    }
    state.filterLabels.forEach(function (l) { chips += chipHtml('label', l, '标签 · ' + l); });
    if (state.filterFavorite) chips += chipHtml('favorite', null, '收藏');
    if (state.search) chips += chipHtml('q', null, '搜索 · ' + state.search);
    var any = !!(state.range || state.filter || state.filterLabels.length || state.filterFavorite || state.search);
    document.getElementById('activeChips').innerHTML =
      chips + (any ? '<button type="button" class="clear-all js-clear-filters">清除筛选</button>' : '');
  }

  function clearAllFilters() {
    state.filter = ''; state.range = ''; state.filterLabels = [];
    state.filterFavorite = false; state.search = '';
    searchInput.value = '';
    clearSelection();
    retryResult.textContent = '';
    applyFilters();
  }

  /* 筛选变化统一入口：重建筛选条/胶囊 → 写 URL → 重拉第一页 */
  function applyFilters() {
    renderFilterBar();
    renderActiveChips();
    syncUrl();
    lastRenderKey = null;
    loadFirst(false);
  }

  function render(force) {
    var count = state.checkedCount;
    var key = renderKey();
    if (!force && key === lastRenderKey) { scheduleRefresh(); return; }
    lastRenderKey = key;
    /* 操作条：DEAD 筛选（重试场景）或存在失败任务（清空场景）或有勾选/全选（导出/删除场景）时出现 */
    retryBar.style.display = state.items.length &&
      (state.filter === 'DEAD' || count > 0 || countState.dead > 0 || state.selectAll) ? 'flex' : 'none';
    retryBtn.style.display = state.filter === 'DEAD' ? '' : 'none'; /* 重试只对 DEAD 开放（语义不变） */
    deleteFailedBtn.style.display = countState.dead > 0 ? '' : 'none'; /* T4.21：无失败任务时隐藏 */
    /* T4.53 缺陷3：全选=当前筛选内全部——total 拿不到就禁用全选（不猜）；勾态 = 全选态 或 已加载全勾 */
    checkAllEl.disabled = state.total === null;
    checkAllEl.checked = state.selectAll || (count > 0 && count === state.items.length);
    retryBtn.disabled = !hasSelection(); /* T4.56：三个批量按钮统一"实际可执行集合是否为空"判据 */
    exportBtn.disabled = !hasSelection();
    deleteBtn.disabled = !hasSelection();
    /* T4.53 缺陷3 + T4.56：全选态在操作条明示数量（N = state.total；有排除时显示 N-M 与排除数） */
    var selHintText = '';
    if (state.selectAll && state.total !== null) {
      var excludedCount = Object.keys(state.excluded).length;
      selHintText = excludedCount > 0
        ? '已选 ' + (state.total - excludedCount) + ' 条（已排除 ' + excludedCount + ' 条）'
        : '已选全部 ' + state.total + ' 条（筛选内）';
    }
    document.getElementById('selHint').textContent = selHintText;
    /* T4.42：计数行「共 N 条 · 已加载 M 条」（N = 当前筛选组合 total；未拿到不显示） */
    var rc = document.getElementById('resultCount');
    if (state.total !== null) {
      rc.textContent = '共 ' + state.total + ' 条 · 已加载 ' + state.items.length + ' 条';
      rc.style.display = '';
    } else {
      rc.style.display = 'none';
    }
    document.getElementById('searchNote').textContent = state.search
      ? '服务端搜索 · 匹配 ' + state.items.length + (state.cursor ? '+' : '') + ' 条。'
      : '';
    if (!state.items.length) {
      listEl.innerHTML = hasActiveFilters() ? noResultHtml() : emptyHtml();
    } else {
      listEl.innerHTML = groupedRowsHtml();
    }
    moreBtn.style.display = state.cursor ? 'inline-flex' : 'none';
    listEl.querySelectorAll('.row-check').forEach(function (box) {
      box.addEventListener('change', function () {
        var id = box.getAttribute('data-id');
        if (state.selectAll) {
          /* T4.56：全选态下勾选框 = "排除"开关——取消勾选→排除该行，重新勾选→恢复包含；不碰 checked/计数 */
          if (box.checked) { delete state.excluded[id]; }
          else { state.excluded[id] = true; }
        } else if (box.checked) {
          state.checked[id] = true; state.checkedCount++;
        } else {
          delete state.checked[id];
          state.checkedCount = Math.max(0, state.checkedCount - 1); /* T4.56：兜底不为负（正常路径递减已配对） */
        }
        render(true); /* 勾选影响操作条状态，强制重绘 */
      });
    });
    listEl.querySelectorAll('.js-clear-filters').forEach(function (btn) {
      btn.addEventListener('click', clearAllFilters);
    });
    refreshLabelOptions(); /* T4.29b：数据到位即刷新标签下拉（不等 30s 计数刷新） */
    scheduleRefresh();
  }

  function loadFirst(isRefresh) {
    state.cursor = null;
    fetchPage(null).then(function (data) {
      if (data.__httpStatus !== 200) { renderFallback(); return; }
      state.items = data.items || [];
      state.cursor = data.next_before_id || null;
      state.total = typeof data.total === 'number' ? data.total : null;
      render(isRefresh !== true);
      scheduleRefresh();
    });
  }

  function loadMore() {
    if (!state.cursor) return;
    moreBtn.disabled = true;
    fetchPage(state.cursor).then(function (data) {
      moreBtn.disabled = false;
      if (data.__httpStatus !== 200) return;
      state.items = state.items.concat(data.items || []);
      state.cursor = data.next_before_id || null;
      if (typeof data.total === 'number') state.total = data.total;
      render(true);
    });
  }

  /* 未完成任务存在时每 3 秒刷新（D-024）；保持当前筛选，勾选状态按 id 保留 */
  function scheduleRefresh() {
    var busy = state.items.some(function (item) {
      return item.status === 'PENDING' || item.status === 'RUNNING' || item.status === 'RETRYING';
    });
    if (busy && !timer) {
      timer = setTimeout(function () { timer = null; loadFirst(true); }, 3000);
    }
  }

  function renderFallback() {
    lastRenderKey = null;
    var index = loadTaskIndex();
    listEl.innerHTML = index.length
      ? '<p class="hint">服务暂时不可用，以下为本浏览器上次提交的缓存：</p>' +
        index.map(function (item) {
          return '<div class="task-row task-row-lite"><span class="task-no">#' + item.id + '</span>' +
            '<span class="task-name"><span class="task-title"><a href="task.html?id=' + item.id + '" class="task-detail-link" data-task-id="' + item.id +
            '" data-task-name="' + escapeHtml(item.name).replace(/"/g, '&quot;') + '">' + escapeHtml(item.name) + '</a></span></span>' +
            '<span class="task-side"><a href="task.html?id=' + item.id + '" class="task-detail-link" data-task-id="' + item.id +
            '" data-task-name="' + escapeHtml(item.name).replace(/"/g, '&quot;') + '">详情</a></span></div>';
        }).join('')
      : emptyOfflineHtml();
  }

  function doBatchRetry() {
    if (batchBusy) return;
    setBatchBusy(true);
    retryResult.textContent = '准备中…';
    resolveSelectedIds().then(function (ids) {
      if (!ids.length) { setBatchBusy(false); retryResult.textContent = ''; return; }
      /* 服务端 RetryRequest 限 1..20 个 id：按筛选全集分块 20/批（T4.53 缺陷3） */
      var batches = [];
      for (var i = 0; i < ids.length; i += 20) {
        batches.push(ids.slice(i, i + 20));
      }
      retryResult.textContent = '重试中… 0/' + ids.length;
      var retriedAll = [], skippedAll = [], done = 0;
      function next() {
        if (done >= batches.length) {
          var skipped = skippedAll.map(function (s) {
            return '#' + s.id + ' ' + (s.reason === 'NOT_DEAD' ? '非失败状态' : '不存在');
          }).join('、');
          retryResult.textContent = '已重试 ' + retriedAll.length + ' 个' +
            (skippedAll.length ? '；跳过：' + skipped : '');
          resetSelection();
          setTimeout(function () { loadFirst(false); }, 800);
          return;
        }
        postJson('api/v1/tasks/retry', { ids: batches[done] }).then(function (data) {
          done++;
          if (data.__httpStatus === 200) {
            retriedAll = retriedAll.concat(data.retried || []);
            skippedAll = skippedAll.concat(data.skipped || []);
            retryResult.textContent = '重试中… ' + Math.min(done * 20, ids.length) + '/' + ids.length;
            next();
          } else {
            /* 任一请求失败立即中止，不静默吞掉剩余块 */
            setBatchBusy(false);
            retryResult.textContent = '失败（' + (data.message || ('HTTP ' + data.__httpStatus)) +
              '）· 已中止，剩余任务未重试。';
          }
        });
      }
      next();
    }, function (err) {
      setBatchBusy(false);
      retryResult.textContent = '收集失败（' + (err && err.message ? err.message : '未知错误') + '），已中止。';
    });
  }

  /* ===== T4.43：行内重命名（PATCH /api/v1/tasks/{id}）——回车保存 / ESC 取消 / 失焦保存；
     K-80：成功后回读详情再更新本地行；失败 toast + 还原。display_name 是独立展示列，
     原文件名与溯源不动 ===== */
  function startRowRename(id) {
    var row = listEl.querySelector('.task-row[data-id="' + id + '"]');
    if (!row || row.querySelector('.rename-input')) return;
    var item = state.items.filter(function (i) { return i.id === id; })[0];
    if (!item) return;
    var title = row.querySelector('.task-title');
    if (!title) return;
    var current = item.display_name || '';
    var wrap = document.createElement('span');
    wrap.className = 'rename-wrap';
    wrap.innerHTML = '<input type="text" class="rename-input" maxlength="120" ' +
      'value="' + escapeAttr(current) + '" aria-label="重命名任务 #' + id + '（回车保存，ESC 取消）">' +
      '<button type="button" class="btn-secondary js-rename-save">保存</button>' +
      '<button type="button" class="btn-secondary js-rename-cancel">取消</button>';
    title.innerHTML = '';
    title.appendChild(wrap);
    var input = wrap.querySelector('.rename-input');
    var settled = false;
    input.focus();
    input.select();
    function finish(mode) {
      if (settled) return;
      settled = true;
      if (mode === 'cancel') { render(true); return; }
      saveRename(id, input.value, current);
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish('save'); }
      else if (e.key === 'Escape') { finish('cancel'); }
    });
    input.addEventListener('blur', function (e) {
      /* 焦点移入保存/取消按钮时不抢跑，交给按钮 click（点取消必须真取消） */
      if (e.relatedTarget && wrap.contains(e.relatedTarget)) return;
      finish('save');
    });
    wrap.querySelector('.js-rename-save').addEventListener('click', function () { finish('save'); });
    wrap.querySelector('.js-rename-cancel').addEventListener('click', function () { finish('cancel'); });
  }

  function saveRename(id, value, original) {
    var v = String(value == null ? '' : value).trim();
    if (v === original) { render(true); return; } /* 无变化 = 直接还原（不发请求） */
    sendJson('api/v1/tasks/' + id, 'PATCH', { display_name: v }).then(function (data) {
      if (data.__httpStatus !== 200) {
        mnDrawerToast('重命名失败：' + (data.message || ('HTTP ' + data.__httpStatus)));
        render(true); /* 失败还原（本地未动，行回到旧名） */
        return;
      }
      /* K-80：PATCH 成功后回读详情，以服务端落库值为准更新列表行 */
      getJson('api/v1/tasks/' + id).then(function (detail) {
        var item = state.items.filter(function (i) { return i.id === id; })[0];
        if (item && detail && detail.__httpStatus === 200) {
          item.display_name = detail.display_name || null;
        }
        render(true);
        mnDrawerToast('已重命名');
      }, function () {
        /* 回读失败用 PATCH 响应兜底（已落库，仅展示层保守） */
        var item = state.items.filter(function (i) { return i.id === id; })[0];
        if (item) item.display_name = v || null;
        render(true);
        mnDrawerToast('已重命名');
      });
    }, function () {
      mnDrawerToast('重命名失败：服务暂时不可用');
      render(true);
    });
  }

  /* 重命名入口（事件委托：行随筛选/翻页重建，委托不重绑） */
  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.js-rename');
    if (!btn) return;
    e.preventDefault();
    startRowRename(Number(btn.getAttribute('data-rename-id')));
  });

  /* ===== T4.42：筛选条事件（时间范围 / 状态 / 收藏 / 标签多选弹层） ===== */
  function closeLabelPop() {
    var pop = document.getElementById('labelPop');
    var btn = document.getElementById('labelMultiBtn');
    if (pop && !pop.hidden) { pop.hidden = true; }
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }

  filterBar.addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    if (btn.id === 'labelMultiBtn') { /* 标签多选弹层开关（点外面/ESC 关闭） */
      var pop = document.getElementById('labelPop');
      var opening = pop.hidden;
      pop.hidden = !opening;
      btn.setAttribute('aria-expanded', String(opening));
      return;
    }
    if (btn.id === 'favoriteFilterBtn') { /* T4.29：收藏开关（独立于状态筛选） */
      state.filterFavorite = !state.filterFavorite;
      clearSelection();
      retryResult.textContent = '';
      applyFilters();
      return;
    }
    var range = btn.getAttribute('data-range');
    if (range !== null) {
      state.range = range;
      clearSelection();
      retryResult.textContent = '';
      applyFilters();
      return;
    }
    state.filter = btn.getAttribute('data-status');
    clearSelection();
    retryResult.textContent = '';
    applyFilters();
  });

  /* 标签多选：复选切换走轻路径（不重建弹层，可连续多选） */
  filterBar.addEventListener('change', function (e) {
    if (!e.target.classList.contains('label-opt-box')) return;
    var v = e.target.value;
    var i = state.filterLabels.indexOf(v);
    if (e.target.checked && i < 0) state.filterLabels.push(v);
    if (!e.target.checked && i >= 0) state.filterLabels.splice(i, 1);
    clearSelection();
    var btn = document.getElementById('labelMultiBtn');
    if (btn) {
      var picked = state.filterLabels.length;
      btn.innerHTML = '标签' + (picked ? ' · ' + picked : '') + '▾';
      btn.classList.toggle('active', picked > 0);
      btn.setAttribute('aria-pressed', String(picked > 0));
    }
    syncUrl();
    renderActiveChips();
    lastRenderKey = null;
    loadFirst(false);
  });

  /* 点弹层外关闭 */
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('.label-multi')) closeLabelPop();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLabelPop();
  });

  /* 已选胶囊：单个移除（dataset 读 kind/value，无分隔符歧义）/ 清除筛选（事件委托，胶囊随筛选重建） */
  document.getElementById('activeChips').addEventListener('click', function (e) {
    var clearBtn = e.target.closest('[data-clear-kind]');
    if (clearBtn) {
      var kind = clearBtn.dataset.clearKind, arg = clearBtn.dataset.clearValue;
      if (kind === 'range') state.range = '';
      else if (kind === 'status') state.filter = '';
      else if (kind === 'label') {
        var i = state.filterLabels.indexOf(arg);
        if (i >= 0) state.filterLabels.splice(i, 1);
      } else if (kind === 'favorite') state.filterFavorite = false;
      else if (kind === 'q') { state.search = ''; searchInput.value = ''; }
      clearSelection();
      retryResult.textContent = '';
      applyFilters();
      return;
    }
    if (e.target.closest('.js-clear-filters')) clearAllFilters();
  });
  checkAllEl.addEventListener('change', function () {
    clearSelection();
    /* T4.53 缺陷3：全选=当前筛选内全部（不再只勾已加载行）——实际 id 集合在动作触发时由
       resolveSelectedIds() 按当前筛选翻页收集；total 为 null 时 render() 已禁用本框 */
    state.selectAll = checkAllEl.checked;
    render(true);
  });
  retryBtn.addEventListener('click', doBatchRetry);
  moreBtn.addEventListener('click', loadMore);

  /* ===== T4.21（D-115）+ T4.53：删除所选（≤100/批分批调 POST /tasks/delete）+ 清空失败任务 =====
     二次确认改站内弹窗（缺陷1）；成功后不再报成功条数文案（缺陷2）；全选=当前筛选内全部（缺陷3）。
     批量动作共用 resolveSelectedIds()：selectAll 时按当前筛选翻页收集全部 id，任一页失败立即中止。 */
  var DELETE_CONFIRM_NOTE = '删除后不可恢复，已用配额不退还。';
  var batchBusy = false; /* T4.53：收集/删除期间防重入 */

  function setBatchBusy(on) {
    batchBusy = on;
    retryBtn.disabled = on;
    exportBtn.disabled = on;
    deleteBtn.disabled = on;
    deleteFailedBtn.disabled = on;
    checkAllEl.disabled = on || state.total === null;
  }

  function resetSelection() {
    clearSelection();
    document.getElementById('selHint').textContent = '';
  }

  /* confirmDialog 已抽到共享文件 confirm.js（T4.57：两页共用一份实现，R4 不重复）；
     引入顺序见 <head> 的 <script src="confirm.js">，本页所有调用点行为与 T4.53/T4.56 验收版一致。 */

  /* 收集将要操作的 id 集合（T4.53 缺陷3 + T4.56）：手动勾选 → 直接返回；
     全选 → 按当前筛选参数（与 filterParams 同源）以 limit=50 + before_id 游标翻页收集全部，
     ACTIVE 按三状态分别翻页去重，然后剔除 excluded（被单独取消的行）；任一页失败立即 reject。
     服务端 MAX_LIMIT=50 是硬拒绝（400），不是 clamp——错误 limit 走统一失败中止路径（D① 已验证）。 */
  function resolveSelectedIds() {
    if (!state.selectAll) {
      return Promise.resolve(Object.keys(state.checked).map(Number).sort(function (a, b) { return a - b; }));
    }
    var q = state.search ? '&q=' + encodeURIComponent(state.search) : '';
    var meta = filterParams();
    function collect(status) {
      var ids = [], seen = {}, cursor = null;
      function step() {
        var url = 'api/v1/tasks?limit=50' +
          (status ? '&status=' + status : '') + q + meta +
          (cursor ? '&before_id=' + cursor : '');
        return getJson(url).then(function (data) {
          if (data.__httpStatus !== 200) {
            throw new Error(data.message || ('HTTP ' + data.__httpStatus));
          }
          (data.items || []).forEach(function (item) {
            if (!seen[item.id]) { seen[item.id] = true; ids.push(item.id); }
          });
          retryResult.textContent = '准备中… 已收集 ' + ids.length + '/' +
            (typeof data.total === 'number' ? data.total : '?') + ' 条';
          cursor = data.next_before_id || null;
          if (cursor) { return step(); }
        });
      }
      return step().then(function () { return ids; });
    }
    var exclude = state.excluded;
    function withoutExcluded(list) {
      return list.filter(function (id) { return !exclude[id]; })
        .sort(function (a, b) { return a - b; });
    }
    if (state.filter === 'ACTIVE') {
      return Promise.all(['PENDING', 'RUNNING', 'RETRYING'].map(function (s) { return collect(s); }))
        .then(function (parts) {
          var seen = {}, ids = [];
          parts.forEach(function (part) {
            part.forEach(function (id) { if (!seen[id]) { seen[id] = true; ids.push(id); } });
          });
          return withoutExcluded(ids);
        });
    }
    return collect(state.filter || null).then(withoutExcluded);
  }

  function deleteSelected() {
    if (batchBusy) return;
    setBatchBusy(true);
    retryResult.textContent = '准备中…';
    resolveSelectedIds().then(function (ids) {
      if (!ids.length) { setBatchBusy(false); retryResult.textContent = ''; return; }
      /* 收集数与「total - 排除数」对不上 = 有页没拉全：宁可中止也不删（负向对照 D② 口径，T4.56 计入排除） */
      var expected = (state.selectAll && state.total !== null)
        ? state.total - Object.keys(state.excluded).length : null;
      if (expected !== null && ids.length !== expected) {
        setBatchBusy(false);
        retryResult.textContent = '收集到 ' + ids.length + ' 条与应选 ' + expected +
          ' 条不一致，已中止删除（请刷新后重试）。';
        return;
      }
      confirmDialog({
        title: '删除确认',
        desc: '删除所选 ' + ids.length + ' 个任务？' + DELETE_CONFIRM_NOTE,
        okText: '删除'
      }).then(function (yes) {
        if (!yes) { setBatchBusy(false); render(true); return; }
        var all = [], done = 0, batches = [];
        for (var i = 0; i < ids.length; i += 100) {
          batches.push(ids.slice(i, i + 100));
        }
        retryResult.textContent = '删除中… 0/' + ids.length;
        function next() {
          if (done >= batches.length) {
            var skipped = all.filter(function (r) { return !r.deleted; }).map(function (r) {
              return '#' + r.id + ' ' + (r.reason === 'TASK_BUSY' ? '进行中' : '不存在');
            }).join('、');
            /* T4.53 缺陷2：不再出现成功条数文案；全部成功清空提示；确有跳过时才说明 */
            retryResult.textContent = skipped ? '部分未删除：' + skipped : '';
            resetSelection();
            lastRenderKey = null;
            loadFirst(false); /* 就地刷新：保留当前筛选/搜索 */
            return;
          }
          postJson('api/v1/tasks/delete', { ids: batches[done] }).then(function (data) {
            done++;
            if (data.__httpStatus === 200 && data.results) {
              all = all.concat(data.results);
              retryResult.textContent = '删除中… ' + Math.min(done * 100, ids.length) + '/' + ids.length;
              next();
            } else {
              /* 任一批失败立即中止：已删部分如实保留，不带着缺 id 的清单继续删 */
              setBatchBusy(false);
              retryResult.textContent = '删除失败（' + (data.message || ('HTTP ' + data.__httpStatus)) +
                '）· 已中止，剩余任务未删除。';
            }
          });
        }
        next();
      });
    }, function (err) {
      setBatchBusy(false);
      retryResult.textContent = '收集失败（' + (err && err.message ? err.message : '未知错误') + '），已中止删除。';
    });
  }

  function deleteFailedAll() {
    if (batchBusy) return;
    /* 清空失败任务作用于服务端全部 DEAD（/tasks/delete-failed 无 ids 参数），与全选态无关 */
    confirmDialog({
      title: '清空确认',
      desc: '清空全部失败（DEAD）任务？' + DELETE_CONFIRM_NOTE,
      okText: '清空'
    }).then(function (yes) {
      if (!yes) return;
      setBatchBusy(true);
      postJson('api/v1/tasks/delete-failed', {}).then(function (data) {
        setBatchBusy(false);
        if (data.__httpStatus === 200) {
          /* T4.53 缺陷2：不再出现成功条数文案 */
          resetSelection();
          lastRenderKey = null;
          loadFirst(false);
        } else {
          retryResult.textContent = '清空失败（' + (data.message || ('HTTP ' + data.__httpStatus)) + '）';
        }
      });
    });
  }
  deleteBtn.addEventListener('click', deleteSelected);
  deleteFailedBtn.addEventListener('click', deleteFailedAll);

  /* T4.24：300ms 防抖 → 带 q 重拉第一页（服务端搜索）；无变化不重复拉。T4.42：q 同步写 URL */
  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      var next = searchInput.value.trim();
      if (next === state.search) return;
      state.search = next;
      applyFilters();
    }, 300);
  });

  /* ===== T4.27 + T4.53：多选批量导出 zip——后端 MAX_ZIP_IDS=20（TaskZipExportController，本卡不改 Java）：
     超限中止并提示（含卡面文案「筛选结果过多，请缩小范围后再导出」），不许静默截断 ===== */
  exportBtn.addEventListener('click', function () {
    if (batchBusy) return;
    setBatchBusy(true);
    retryResult.textContent = '准备中…';
    resolveSelectedIds().then(function (ids) {
      if (!ids.length) { setBatchBusy(false); retryResult.textContent = ''; return; }
      if (ids.length > 20) {
        setBatchBusy(false);
        retryResult.textContent = '筛选结果过多，请缩小范围后再导出（导出一次最多 20 个，当前选中 ' +
          ids.length + ' 个）。';
        return;
      }
    exportBtn.disabled = true;
    retryResult.textContent = '打包导出中…（' + ids.length + ' 个任务）';
    apiFetch('api/v1/tasks/export?ids=' + ids.join(',')).then(function (resp) {
      if (resp.status !== 200) {
        return resp.json().then(function (err) {
          setBatchBusy(false);
          retryResult.textContent = '导出失败（' + (err.code || resp.status) + '）：' + (err.message || '未知错误');
        }, function () {
          setBatchBusy(false);
          retryResult.textContent = '导出失败（HTTP ' + resp.status + '）';
        });
      }
      return resp.blob().then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        var stamp = new Date();
        var pad = function (n) { return (n < 10 ? '0' : '') + n; };
        a.download = 'meeting-notes-' + stamp.getFullYear() + pad(stamp.getMonth() + 1) + pad(stamp.getDate()) +
          '-' + pad(stamp.getHours()) + pad(stamp.getMinutes()) + '.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
        setBatchBusy(false);
        retryResult.textContent = '已下载 zip（' + ids.length + ' 个任务' +
          (ids.length < 20 ? '；不存在的任务会在 zip 内 _errors.txt 说明' : '') + '）。';
      });
    }, function () {
      setBatchBusy(false);
      retryResult.textContent = '导出失败：服务暂时不可用，请稍后重试。';
    });
    }); /* T4.53：闭合 resolveSelectedIds().then —— 全选态下导出走同一收集链 */
  });

  /* 档案抬头行日期（T4.41） */
  (function () {
    var el = document.getElementById('docketDate');
    if (!el) return;
    var d = new Date();
    var p = function (n) { return n < 10 ? '0' + n : String(n); };
    el.textContent = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  })();

  /* ===== 启动（T4.42：先还原 URL 筛选，非法参数回退默认 + toast 不白屏） ===== */
  var boot = parseUrlFilters();
  state.range = boot.range;
  state.filter = boot.status;
  state.filterLabels = boot.labels;
  state.filterFavorite = boot.favorite;
  state.search = boot.q;
  searchInput.value = boot.q;
  renderFilterBar();
  renderActiveChips();
  if (boot.invalid) mnDrawerToast('筛选参数无效，已回退默认视图');
  /* T4.38：详情站内抽屉（列表 URL 不变、不新开标签；ESC/遮罩关闭） */
  mnBindDrawerLinks(listEl);
  fetchCounts(); /* T4.24：状态计数改调 /tasks/counts（真计数无上限，页面可见时 30s 自动刷新保留） */
  getJson('api/v1/tasks?limit=20').then(function (data) {
    if (data.__httpStatus === 200) { loadFirst(false); }
    else { renderFallback(); }
  });
})();
</script>
