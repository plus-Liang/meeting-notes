<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="查看转写任务：按状态筛选，进行中任务自动刷新，失败任务可批量重试。">
<title>任务台账 · 录音纪要平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E%E2%96%B6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="docket">
    <b>REC-NOTES</b><span>自托管 · 私有部署</span>
    <span class="r">
      <span id="docketCounts">—</span>
      <span id="docketDate">—</span>
      <span>V0.1.0</span>
    </span>
  </div>

  <header class="top">
    <a class="brand" href="index.html">录音纪要平台<em>transcript &amp; minutes</em></a>
    <nav class="nav">
      <a href="index.html">提交</a>
      <a href="tasks.html" aria-current="page">任务台账</a>
      <a href="settings.html">设置</a>
    </nav>
    <span class="who mn-userbar" data-mn-userbar></span>
  </header>

  <section class="mast">
    <h1>任务台账</h1>
    <dl class="meta">
      <div><dt>全部</dt><dd class="big" id="mastTotal">—</dd></div>
      <div><dt>进行中</dt><dd id="mastActive">—</dd></div>
      <div><dt>已完成</dt><dd id="mastDone">—</dd></div>
      <div><dt>失败</dt><dd id="mastDead">—</dd></div>
    </dl>
  </section>

  <main>
    <div class="search-box">
      <input type="search" id="searchInput" maxlength="100" placeholder="按文件名或任务编号搜索" aria-label="搜索任务（服务端搜索）">
      <p class="search-note" id="searchNote"></p>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="active-chips" id="activeChips"></div> <!-- T4.42：已选条件胶囊（可单个移除）+ 清除筛选 -->
    <div class="retry-bar" id="retryBar" style="display:none;">
      <label><input type="checkbox" id="checkAll"> 全选当前筛选</label> <!-- T4.53 缺陷3：全选=当前筛选内全部 -->
      <span class="batch-actions">
        <button id="batchRetryBtn" class="btn-secondary">批量重试</button>
        <button id="exportBtn" class="btn-secondary">导出选中 Markdown</button>
        <button id="deleteBtn" class="btn-danger">删除所选</button>
        <button id="deleteFailedBtn" class="btn-danger">清空失败任务</button>
        <button id="restoreBtn" class="btn-secondary" style="display:none;">恢复所选</button><button id="purgeBtn" class="btn-danger" style="display:none;">彻底删除所选</button><button id="purgeAllBtn" class="btn-danger" style="display:none;">清空回收站</button>
      </span>
      <span id="selHint" class="hint"></span>
      <span id="retryResult" class="hint"></span>
    </div>
    <p class="result-count" id="resultCount" style="display:none;"></p> <!-- T4.42：共 N 条 · 已加载 M 条 -->
    <div id="list" aria-live="polite">
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:45%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:60%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:38%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:52%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
      <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:30%"></div><div class="skeleton skeleton-line" style="width:88px"></div></div>
    </div>
    <p><button id="moreBtn" class="btn-secondary" style="display:none;">加载更多</button></p>
  </main>

  <footer class="site-footer">
    <span>私有部署 · 数据只在你自己的服务器</span>
    <a href="https://github.com/plus-Liang/meeting-notes" rel="noopener">GitHub</a>
    <span>录音纪要平台 · 白纸档案</span>
  </footer>
</div>
    <script src="auth.js"></script>
    <script src="app.js"></script>
<script src="escape.js"></script>
    <script src="confirm.js"></script>
    <script src="drawer.js"></script>
<script src="tasks-page.js"></script>
</body>
</html>
