<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="查看转写任务详情：转写全文、AI 摘要、关键词、待办与 Markdown 导出。">
<title>任务详情 · 录音纪要平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E%E2%96%B6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="docket">
    <b>REC-NOTES</b><span>自托管 · 私有部署</span>
    <span class="r"><span id="docketDate">—</span><span>V0.1.0</span></span>
  </div>

  <header class="top">
    <a class="brand" href="index.html">录音纪要平台<em>transcript &amp; minutes</em></a>
    <nav class="nav">
      <a href="index.html">提交</a>
      <a href="tasks.html" aria-current="page">任务台账</a>
      <a href="settings.html">设置</a>
    </nav>
    <span class="who mn-userbar" data-mn-userbar></span>
  </header>

  <main>
    <div id="card">
      <div class="skeleton skeleton-block" style="width:38%;margin-top:36px"></div>
      <div class="skeleton skeleton-line" style="width:30%"></div>
      <div class="skeleton skeleton-block" style="width:100%"></div>
      <div class="skeleton skeleton-block" style="width:100%"></div>
    </div>
  </main>

  <footer class="site-footer">
    <span>私有部署 · 数据只在你自己的服务器</span>
    <a href="https://github.com/plus-Liang/meeting-notes" rel="noopener">GitHub</a>
    <span>录音纪要平台 · 白纸档案</span>
  </footer>
</div>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="escape.js"></script>
<script src="confirm.js"></script>
<script>
(function () {
  /* T4.38：被站内抽屉 iframe 内嵌时藏导航/页脚（深链 task.html?id= 直接访问不受影响） */
  if (window.self !== window.top) document.documentElement.classList.add('mn-embedded');
  var card = document.getElementById('card');
  var id = new URLSearchParams(location.search).get('id');
  if (!id || !/^\d+$/.test(id)) {
    card.innerHTML = '<h1>任务不存在</h1><p class="hint">请从<a href="tasks.html">任务列表</a>进入。</p>';
    return;
  }

  function errorTextOf(code) {
    return ERROR_TEXT[code] || ('未知错误码：' + code);
  }

  /* ===== T4.95/C5：失败可视——「为什么失败」块（DEAD/RETRYING 才渲染） =====
     人话优先接口 error_message（dead_letter.reason）；无则用前端码→文案映射（与后端
     FailureReason.java 同文案，两处必须同步改）；未知码原样显示不编造。全部 escapeHtml/escapeAttr。 */
  var FAILURE_TEXT = {
    STORAGE_ERROR: { title: '文件读取失败', hint: '检查对象存储是否可用、文件是否被移动或删除；重新提交即可重试。' },
    ASR_ERROR: { title: '语音识别失败', hint: '检查 ASR 容器是否健康（`/api/v1/admin/storage` 页或 `docker logs`）；换一种音频格式再试。' },
    WORKER_CRASH: { title: '处理进程异常中断', hint: '该任务连续中断已达上限；查看 `docker logs` 中 `taskId` 对应的 ERROR，必要时重启服务。' },
    QUEUE_UNAVAILABLE: { title: '队列不可用', hint: 'Redis 可能不可用；恢复后点「重试」即可。' },
    UNKNOWN_ERROR: { title: '未知错误', hint: '把这段错误码复制给开发者，或查看容器日志。' }
  };

  function failureHintOf(code) {
    if (!code) return FAILURE_TEXT.UNKNOWN_ERROR;
    return FAILURE_TEXT[code] || { title: code, hint: FAILURE_TEXT.UNKNOWN_ERROR.hint };
  }

  function failureHtml(data) {
    var h = failureHintOf(data.error_code);
    var reason = data.error_message || h.title;
    var attempts = (data.attempts === null || data.attempts === undefined) ? '—' : data.attempts;
    var diag = '任务 #' + data.task_id + '｜状态 ' + data.status +
      '｜错误码 ' + (data.error_code || '—') +
      '｜原因 ' + (data.error_message || h.title) +
      '｜已尝试 ' + attempts + ' 次';
    return '<div class="section" id="failBox"><h2>为什么失败</h2>' +
      '<dl class="facts">' +
      '<dt>原因</dt><dd>' + escapeHtml(reason) + '</dd>' +
      '<dt>建议</dt><dd>' + escapeHtml(h.hint) + '</dd>' +
      '<dt>已尝试</dt><dd>' + attempts + ' 次</dd>' +
      '</dl>' +
      '<button type="button" class="btn-secondary js-copy-diag" data-diag="' + escapeAttr(diag) + '"' +
      ' aria-label="复制诊断信息">复制诊断信息</button>' +
      '</div>';
  }

  /* 复制诊断信息：clipboard API 优先，textarea + execCommand 兜底；结果用 mnToast 提示（禁 alert，M-13）。 */
  function bindCopyDiag(data) {
    var btn = card.querySelector('.js-copy-diag');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var text = btn.getAttribute('data-diag');
      var done = function () { mnToast('已复制诊断信息'); };
      var fallback = function () {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { mnToast('复制失败，请手动选择文本'); }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }
    });
  }

  var transcript = ''; /* T4.15⑧：详情逐字稿缓存（供关键词/依据定位）；T4.18 起为**展示文本**（有 AI 标点则用标点文本），只读不回写 */
  var displayText = ''; /* T4.18：页面实际展示文本（句子按行拼接），「复制全文」以它为准（复制==页面文本） */

  var TEMPLATE_TEXT = {
    meeting: '会议纪要', course: '课程纪要', interview: '访谈纪要',
    podcast: '播客纪要', shortvideo: '短视频纪要'
  };
  var TIER_TEXT = { CLOUD: '云端 AI', LOCAL: '本地 AI', EXTRACTIVE: '提取式' };
  var TIER_CLS = { CLOUD: 'busy', LOCAL: 'done', EXTRACTIVE: '' };

  function badge(text, cls) {
    return '<span class="badge' + (cls ? ' ' + cls : '') + '">' + escapeHtml(text) + '</span>';
  }

  function headHtml(data) {
    var badges = badge(statusText(data.status), data.status === 'DONE' ? 'done' : (data.status === 'DEAD' ? 'dead' : 'busy'));
    if (data.template) {
      badges += ' ' + badge(TEMPLATE_TEXT[data.template] || data.template);
    }
    if (data.ai_tier) {
      badges += ' ' + badge(TIER_TEXT[data.ai_tier] || data.ai_tier, TIER_CLS[data.ai_tier] || '');
    }
  /* T4.41：详情刊头 = mn-detail-head（左：衬线大标题 + 状态徽章行；右：meta 表），对齐定稿稿刊头语汇。
     T4.43：标题旁展示 display_name（用户展示名，null=未命名只显示编号）+「重命名」入口（药丸按钮）。 */
    var namePart = data.display_name
      ? '<span class="mn-task-name"> · ' + escapeHtml(data.display_name) + '</span>' : '';
    return '<div class="mn-detail-head">' +
      '<div><h1>任务 <span class="num">#' + data.task_id + '</span>' + namePart +
      '<button type="button" class="btn-secondary js-rename-btn" id="renameBtn" ' +
      'aria-label="重命名任务 #' + data.task_id + '">重命名</button></h1>' +
      '<div class="task-sub" style="margin-top:10px">' + badges + '</div></div>' +
      '<dl class="meta">' +
      '<div><dt>时长</dt><dd>' + fmtDuration(data.duration_sec) + '</dd></div>' +
      '<div><dt>大小</dt><dd>' + fmtBytes(data.size_bytes) + '</dd></div>' +
      '<div><dt>提交时间</dt><dd>' + fmtDate(data.created_at) + '</dd></div>' +
      '</dl></div>';
  }

  /* ===== T4.43：重命名（PATCH /api/v1/tasks/{id}）——回车保存 / ESC 取消 / 失焦保存；
     K-80：成功后回读详情重绘整卡（标题/导出文案以服务端落库值为准）；失败 toast + 还原。
     display_name 是独立展示列，原文件名与溯源不动 ===== */
  var lastDetail = null;
  var renameActive = false; /* 编辑中：3s 轮询不重绘防输入被吞；finish 时先清标记再 render（防自锁） */

  /* 轻提示 toast（墨底 pill，复用 .mn-drawer-toast 样式；2.2s 自动消失） */
  function mnToast(text) {
    var old = document.querySelector('.mn-page-toast');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var el = document.createElement('div');
    el.className = 'mn-drawer-toast mn-page-toast';
    el.textContent = text;
    document.body.appendChild(el);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { el.classList.add('show'); });
    });
    setTimeout(function () { el.classList.remove('show'); }, 2200);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
  }

  /* 导出文件名优先展示名（安全化同服务端口径：非法字符 → _，空则回退 meeting-notes-<id>） */
  function exportDownloadName(data) {
    var base = data.display_name
      ? String(data.display_name).replace(/[\\/:*?"<>|\r\n\t]/g, '_').trim() : '';
    if (!base) base = 'meeting-notes-' + data.task_id;
    return base + '.md';
  }

  function startDetailRename(data) {
    var h1 = card.querySelector('.mn-detail-head h1');
    if (!h1 || h1.querySelector('.rename-input')) return;
    renameActive = true;
    var current = data.display_name || '';
    var wrap = document.createElement('span');
    wrap.className = 'rename-wrap';
    wrap.innerHTML = '<input type="text" class="rename-input" maxlength="120" value="' +
      escapeAttr(current) + '" aria-label="重命名任务（回车保存，ESC 取消）">' +
      '<button type="button" class="btn-secondary js-rename-save">保存</button>' +
      '<button type="button" class="btn-secondary js-rename-cancel">取消</button>';
    h1.innerHTML = '任务 <span class="num">#' + data.task_id + '</span> ';
    h1.appendChild(wrap);
    var input = wrap.querySelector('.rename-input');
    var settled = false;
    input.focus();
    input.select();
    function finish(mode) {
      if (settled) return;
      settled = true;
      renameActive = false; /* 先清编辑标记，render 才能重绘（保存/取消共用） */
      if (mode === 'cancel') { render(lastDetail); return; }
      saveDetailRename(data.task_id, input.value, current);
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish('save'); }
      else if (e.key === 'Escape') { finish('cancel'); }
    });
    input.addEventListener('blur', function (e) {
      if (e.relatedTarget && wrap.contains(e.relatedTarget)) return;
      finish('save');
    });
    wrap.querySelector('.js-rename-save').addEventListener('click', function () { finish('save'); });
    wrap.querySelector('.js-rename-cancel').addEventListener('click', function () { finish('cancel'); });
  }

  function saveDetailRename(id, value, original) {
    var v = String(value == null ? '' : value).trim();
    if (v === original) { render(lastDetail); return; } /* 无变化 = 直接还原（不发请求） */
    sendJson('api/v1/tasks/' + id, 'PATCH', { display_name: v }).then(function (resp) {
      if (resp.__httpStatus !== 200) {
        mnToast('重命名失败：' + (resp.message || ('HTTP ' + resp.__httpStatus)));
        render(lastDetail); /* 失败还原（K-80：以服务端为准，本地未动） */
        return;
      }
      /* K-80：PATCH 成功后回读详情重绘整卡（标题/导出文案同步新名） */
      getJson('api/v1/tasks/' + id).then(function (detail) {
        if (detail && detail.__httpStatus === 200) {
          render(detail);
        } else {
          render(lastDetail);
        }
        mnToast('已重命名');
      }, function () {
        render(lastDetail); /* 回读失败保持现值（已落库） */
        mnToast('已重命名');
      });
    }, function () {
      mnToast('重命名失败：服务暂时不可用');
      render(lastDetail);
    });
  }

  function bindDetailRename(data) {
    var btn = document.getElementById('renameBtn');
    if (!btn) return;
    btn.addEventListener('click', function () { startDetailRename(data); });
  }

  /* D-072 语义：null = AI 未启用或生成失败；[] = 确实没有内容。两者文案必须区分 */
  function nullHint() {
    return '<p class="hint">AI 未启用或本次未生成，暂无内容。</p>';
  }

  /* T4.15c：区分"没识别到语音"与"AI 没跑成"两种真实原因——
     transcript===''（静音/纯音乐）时优先显示无语音文案，避免误导用户以为 AI 坏了（D-048：空转写仍是 DONE） */
  function noSpeechHint(text) {
    return '<p class="hint">' + text + '</p>';
  }
  var NO_SPEECH_SUMMARY = '这段音频未识别到语音（可能是纯音乐、静音或无人声），所以没有摘要、关键词和待办。';
  var NO_SPEECH_TODOS = '这段音频未识别到语音，没有待办。';

  /* T4.23（D-121）：摘要依据——逐摘要句在原文里按连续 2–3 句窗口找依据（口径复用 mnGroundSummaryWindow）；
     文案固定「在原文中匹配到的句子」，未命中写「未找到直接依据」，绝不声称是模型给出的依据 */
  function summaryGroundHtml(data) {
    if (!data.summary || transcript === '') return '';
    var grounds = mnGroundSummaryWindow(data.summary, transcript);
    if (!grounds.length) return '';
    var hitCount = 0;
    var rows = grounds.map(function (g) {
      var n = g.sumIndex + 1;
      if (!g.hit) {
        return '<li>第 ' + n + ' 句 · <span class="ground-miss">未找到直接依据</span></li>';
      }
      hitCount++;
      var frag = g.fragment.length > 60 ? g.fragment.slice(0, 60) + '…' : g.fragment;
      return '<li>第 ' + n + ' 句 ↔ 原文：<button type="button" class="ground-link" data-sent="' +
        g.sentIdx + '" title="定位到原文">「' + escapeHtml(frag) + '」</button></li>';
    }).join('');
    return '<div class="summary-ground"><div class="summary-ground-title">摘要依据 · 找到 ' + hitCount + '/' +
      grounds.length + ' 句（在原文中匹配到的句子，浏览器内重算）</div><ul>' + rows + '</ul></div>';
  }

  /* T4.15⑧：关键词 chip 可定位（命中有依据句才可点，点它跳到逐字稿高亮；未命中保持不可点）。
     T4.41：关键词独立成块（定稿稿骨架：右栏 待办/关键词/模板/转写口径/导出） */
  function keywordsHtml(data) {
    if (!data.keywords || !data.keywords.length) {
      return data.keywords ? '<div class="section"><h2>关键词</h2><p class="hint" style="margin:0">没有关键词。</p></div>' : '';
    }
    var html = '<div class="section"><h2>关键词</h2>';
    html += '<div class="chips">' + data.keywords.map(function (k) {
      var hit = transcript ? mnGroundKeyword(k, transcript) : null;
      return '<button type="button" class="chip ' + (hit ? 'linkable' : 'plain') + '"' +
        (hit ? ' data-keyword="' + escapeHtml(k) + '" title="定位到原文"' : ' disabled') + '>' +
        escapeHtml(k) + '</button>';
    }).join('') + '</div>' +
      '<p class="hint" style="margin:4px 0 0">点关键词可跳到逐字稿中匹配到的句子。</p>';
    return html + '</div>';
  }

  /* T4.41：转写口径（右栏 facts；全部取自详情已有字段，不造数据） */
  function factsHtml(data) {
    var segCount = Array.isArray(data.segments) ? data.segments.length : null;
    return '<div class="section"><h2>转写口径</h2><dl class="facts">' +
      '<dt>模板</dt><dd>' + escapeHtml(data.template ? (TEMPLATE_TEXT[data.template] || data.template) : '—') + '</dd>' +
      '<dt>档位</dt><dd>' + escapeHtml(data.ai_tier ? (TIER_TEXT[data.ai_tier] || data.ai_tier) : '—') + '</dd>' +
      '<dt>分段</dt><dd>' + (segCount === null ? '—' : segCount) + '</dd>' +
      '<dt>字数</dt><dd>' + (transcript ? transcript.length : 0) + '</dd>' +
      '</dl></div>';
  }

  function summaryHtml(data) {
    if (!data.summary) {
      return '<div class="section"><h2>摘要</h2>' +
        (transcript === '' ? noSpeechHint(NO_SPEECH_SUMMARY) : nullHint()) + '</div>';
    }
    return '<div class="section"><h2>摘要</h2>' +
      '<p class="drop" style="margin:0 0 8px">' + escapeHtml(data.summary) + '</p>' + summaryGroundHtml(data) + '</div>';
  }

  /* T4.17：音频要点（编号 + 加粗小标题 + ：说明）。null/空 = AI 未启用或本次未生成（历史任务同语义，D-109） */
  function keypointsHtml(data) {
    var html = '<div class="section"><h2>要点</h2>';
    if (!data.keypoints || !data.keypoints.length) {
      html += '<p class="hint" style="margin:0">AI 未启用或本次未生成，暂无要点。</p>';
    } else {
      html += '<ol class="keypoints">' + data.keypoints.map(function (kp) {
        return '<li><strong>' + escapeHtml(kp.title) + '</strong>：' + escapeHtml(kp.detail) + '</li>';
      }).join('') + '</ol>';
    }
    return html + '</div>';
  }

  /* T4.15⑨：待办可勾选（PATCH）/ 可删除（DELETE）/ 依据定位⑧；D-104 口径：匹配不到写「未找到直接依据」 */
  function todosHtml(data) {
    var html = '<div class="section"><div class="section-head"><h2>待办</h2>' +
      '<span class="hint" id="todoMsg" hidden></span></div><div id="todoList">';
    if (data.todos === null || data.todos === undefined) {
      html += transcript === '' ? noSpeechHint(NO_SPEECH_TODOS) : nullHint();
    } else if (!data.todos.length) {
      html += '<p class="hint" style="margin:0">本段内容没有待办事项。</p>';
    }
    return html + '</div></div>';
  }

  /* T4.18：转写优先用 AI 标点文本（transcript_punctuated），一句一行；无标点回退原始转写（旧渲染口径）。
     展示文本 = mnSplitSentences(transcript)，定位/复制/依据都以它为准（normalize+bigram 口径不变） */
  function transcriptHtml(data) {
    var html = '<div class="section"><div class="section-head"><h2>转写</h2>' +
      '<span class="batch-actions"><button type="button" class="btn-secondary" id="copyTranscriptBtn">复制全文</button>' +
      '<span class="copied-text" id="copiedHint" hidden>已复制</span></span></div>';
    if (data.transcript === '') {
      html += '<p class="empty-tip">未识别到语音内容：这段音频里没有可识别的人声（可能是纯音乐、静音或无人声）。</p>';
    } else {
      var sents = mnSplitSentences(transcript);
      displayText = sents.join('\n');
      html += '<div class="transcript">' + sents.map(function (s, i) {
        return '<span class="sent-target" data-sent="' + i + '">' + escapeHtml(s) + '</span>';
      }).join('\n') + '</div>';
    }
    return html + '</div>';
  }

  /* T4.18：导出勾选（摘要/关键词/要点/转写/待办 + 全选）。默认不含待办（观察期，D-109）；至少勾 1 项才能下载 */
  var EXPORT_SECTIONS = [
    { key: 'summary', label: '摘要' },
    { key: 'keywords', label: '关键词' },
    { key: 'keypoints', label: '要点' },
    { key: 'transcript', label: '转写' },
    { key: 'todos', label: '待办' }
  ];
  var exportSel = { summary: true, keywords: true, keypoints: true, transcript: true, todos: false };

  function exportHtml(data) {
    var boxes = EXPORT_SECTIONS.map(function (s) {
      return '<label class="export-opt"><input type="checkbox" class="export-check" data-key="' + s.key + '"' +
        (exportSel[s.key] ? ' checked' : '') + '> ' + s.label + '</label>';
    }).join('');
    return '<div class="section"><h2>导出</h2>' +
      '<div class="export-opts">' + boxes +
      '<button type="button" class="btn-secondary export-all" id="exportAllBtn">全选</button></div>' +
      '<button type="button" class="btn-secondary" id="exportBtn">下载 Markdown</button>' +
      '<p class="hint" id="exportMsg" style="margin-top:8px">至少勾选一项；默认不含待办（观察期）。导出内容为 Markdown 纪要文件。</p></div>';
  }

  /* T4.21（D-115）：详情页删除入口（二次确认文案含"不可恢复/配额不退还"；成功跳回列表） */
  function deleteHtml(data) {
    return '<div class="section"><h2>删除</h2>' +

      '<p class="hint" id="deleteMsg" style="margin-top:8px">删除后不可恢复，已用配额不退还。进行中（排队/转写/重试）的任务不能删除。</p></div>';
  }

  /* T4.29（D-137）：标签与收藏——GET /meta 取初值，PATCH 更新（labels <=10 个 1-20 字去重、favorite 布尔）；
     详情 14 键不动，meta 走独立端点 */
  var meta = { labels: [], favorite: false };

  function metaHtml() {
    return '<div class="section"><h2>标签与收藏</h2>' +
      '<p style="margin:0 0 8px"><button type="button" class="btn-secondary" id="favToggleBtn"></button>' +

  }

  function renderMeta() {
    document.getElementById('favToggleBtn').textContent =
      meta.favorite ? '★ 已收藏（点击取消）' : '☆ 收藏';
    var chips = document.getElementById('labelChips');
    chips.innerHTML = meta.labels.length
      ? meta.labels.map(function (l) {
          return '<span class="chip plain">' + escapeHtml(l) +
            '<button type="button" class="chip-x" data-label="' + escapeHtml(l) +
            '" aria-label="删除标签"> ×</button></span>';
        }).join('')
      : '<p class="hint" style="margin:0">暂无标签。</p>';
    chips.querySelectorAll('.chip-x').forEach(function (x) {
      x.addEventListener('click', function () {
        var label = x.getAttribute('data-label');
        updateMeta({ labels: meta.labels.filter(function (l) { return l !== label; }) });
      });
    });
  }

  function updateMeta(patch) {
    var msg = document.getElementById('metaMsg');
    var addBtn = document.getElementById('labelAddBtn');
    var favBtn = document.getElementById('favToggleBtn');
    addBtn.disabled = true;
    favBtn.disabled = true;
    /* K-80：端点是 PATCH，postJson 写死 method:'POST' 会 405——必须 sendJson 指定方法 */
    sendJson('api/v1/tasks/' + id + '/meta', 'PATCH', patch).then(function (resp) {
      addBtn.disabled = false;
      favBtn.disabled = false;
      if (resp.__httpStatus === 200) {
        meta = { labels: resp.labels || [], favorite: !!resp.favorite };
        renderMeta();
        msg.textContent = '已保存。';
      } else {
        msg.textContent = '保存失败（' + (resp.code || resp.__httpStatus) + '）：' + (resp.message || '未知错误');
      }
    }, function () {
      addBtn.disabled = false;
      favBtn.disabled = false;
      msg.textContent = '保存失败：服务暂时不可用。';
    });
  }

  function initMeta(data) {
    meta = { labels: [], favorite: false };
    renderMeta();
    getJson('api/v1/tasks/' + data.task_id + '/meta').then(function (resp) {
      if (resp.__httpStatus === 200) {
        meta = { labels: resp.labels || [], favorite: !!resp.favorite };
        renderMeta();
      }
    }, function () { /* meta 读取失败不打扰主内容 */ });
    document.getElementById('favToggleBtn').addEventListener('click', function () {
      updateMeta({ favorite: !meta.favorite });
    });
    document.getElementById('labelAddBtn').addEventListener('click', function () {
      var input = document.getElementById('labelInput');
      var value = input.value.trim();
      if (!value || meta.labels.indexOf(value) >= 0) { input.value = ''; return; }
      updateMeta({ labels: meta.labels.concat([value]) });
      input.value = '';
    });
  }

  /* T4.26（F-17）：换模板重跑——只用已存转写重跑结构化；二次确认覆盖语义，成功后整页刷新 */
  var TEMPLATE_NAMES = { meeting: '会议', course: '课程', interview: '访谈', podcast: '播客', shortvideo: '短视频' };

      '<p class="hint" id="restructureMsg" style="margin-top:8px">只用已保存的转写重跑摘要/关键词/待办/要点：不重跑转写、不新建任务、不消耗配额；但会<b>覆盖</b>当前结果与模板。</p></div>';

  function bindRestructure(data) {

    btn.addEventListener('click', async function () {

        okText: '重新生成'
      }))) return;
      btn.disabled = true;

      postJson('api/v1/tasks/' + data.task_id + '/restructure', { template: template }).then(function (resp) {
        if (resp.__httpStatus === 200) {
          window.location.reload(); /* 成功后整页刷新：新摘要/关键词/待办/要点/模板全量可见 */

  function bindShare(data) {

    createBtn.addEventListener('click', function () {

        } else {

    document.getElementById('shareRevokeBtn').addEventListener('click', async function () {

      if (!(await confirmDialog({

      sendJson('api/v1/tasks/' + data.task_id + '/share', 'DELETE').then(function (resp) {

  function bindDelete(data) {
    var btn = document.getElementById('deleteTaskBtn');
    var msgEl = document.getElementById('deleteMsg');
    btn.addEventListener('click', async function () {

        if (resp.__httpStatus === 200) {

  function selectedInclude() {
    return EXPORT_SECTIONS.filter(function (s) { return exportSel[s.key]; })
      .map(function (s) { return s.key; }).join(',');
  }

  function refreshExportBtn() {
    var btn = document.getElementById('exportBtn');
    if (!btn) return;
    btn.disabled = selectedInclude() === '';
  }

  function bindExport(data) {
    card.querySelectorAll('.export-check').forEach(function (box) {
      box.addEventListener('change', function () {
        exportSel[box.getAttribute('data-key')] = box.checked;
        refreshExportBtn();
      });
    });
    var allBtn = document.getElementById('exportAllBtn');
    allBtn.addEventListener('click', function () {
      card.querySelectorAll('.export-check').forEach(function (box) {
        box.checked = true;
        exportSel[box.getAttribute('data-key')] = true;
      });
      refreshExportBtn();
    });
    var btn = document.getElementById('exportBtn');
    var msgEl = document.getElementById('exportMsg');
    btn.disabled = selectedInclude() === '';
    btn.addEventListener('click', function () {
      var include = selectedInclude();
      if (!include) {
        msgEl.textContent = '至少勾选一项才能导出。';
        return;
      }
      btn.disabled = true;
      apiFetch('api/v1/tasks/' + data.task_id + '/export?format=md&include=' + encodeURIComponent(include)).then(function (resp) {
        if (resp.status !== 200) {
          return resp.json().then(function (err) {
            msgEl.textContent = '导出失败（' + (err.code || resp.status) + '）：' + (err.message || '未知错误');
            btn.disabled = false;
          }, function () {
            msgEl.textContent = '导出失败（HTTP ' + resp.status + '）';
            btn.disabled = false;
          });
        }
        return resp.text().then(function (text) {
          var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
          var dlName = exportDownloadName(data); /* T4.43：优先展示名 */
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = dlName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(a.href);
          msgEl.textContent = '已开始下载 ' + dlName + '。';
          btn.disabled = false;
        });
      }, function () {
        msgEl.textContent = '导出失败：服务暂时不可用，请稍后重试。';
        btn.disabled = false;
      });
    });
  }

  /* escapeHtml/escapeAttr 已收敛到共享 escape.js（T4.59）；属性上下文一律 escapeAttr（含引号，同 tasks.html 口径） */

  function render(data) {
    lastDetail = data;
    if (renameActive) return false; /* T4.43：改名编辑中轮询不重绘（finish 先清 renameActive 再 render） */
    if (data.__httpStatus === 404) {
      card.innerHTML = '<h1>任务不存在</h1>' +
        '<p class="hint">任务 #' + escapeHtml(id) + ' 不存在或不可见（404 TASK_NOT_FOUND）。' +
        '请从<a href="tasks.html">任务列表</a>进入。</p>';
      return true;
    }
    if (data.__httpStatus === 0) {
      card.innerHTML = '<h1>服务暂时不可用</h1><p class="hint">正在自动重试…</p>';
      return false; /* 网络抖动继续轮询 */
    }
    var status = data.status;
    /* T4.18：展示/定位统一用标点文本（无则原始转写）；空转写仍以 data.transcript 为准判无语音 */
    transcript = data.transcript_punctuated || data.transcript || '';
    var head = headHtml(data);
    var body = '';
    if (status === 'PENDING') {
      body = '<div class="section"><p class="hint">排队中，正在等待空闲的转写线程…（每 3 秒自动刷新）</p>' +
        '<div class="skeleton skeleton-block" style="width:100%"></div></div>';
    } else if (status === 'RUNNING') {
      body = '<div class="section"><p class="hint">转写中，请稍候…（每 3 秒自动刷新）</p>' +
        '<div class="skeleton skeleton-block" style="width:100%"></div>' +
        '<div class="skeleton skeleton-block" style="width:92%"></div></div>';
    } else if (status === 'RETRYING') {
      /* T4.95：结构化原因/建议/已尝试前置（原「原因：」行并入 failureHtml，避免重复展示） */
      body = failureHtml(data) +
        '<div class="section"><p class="error-text">转写遇到问题，正在自动重试，请稍候（每 3 秒自动刷新）。</p>' +
        '</div>';
    } else if (status === 'DEAD') {
      /* T4.95：同上；「原因：」行并入 failureHtml */
      body = failureHtml(data) +
        '<div class="section"><p class="error-text">转写失败。</p>' +
        '<p class="hint">请检查 ASR 服务是否正常后，可在<a href="tasks.html">任务列表</a>按"失败"筛选并批量重试。</p></div>';
    } else if (status === 'DONE') {
      /* T4.41：按定稿稿骨架两栏（左：摘要+要点+播放器+逐字稿；右：待办/关键词/标签/模板/转写口径/分享/导出/删除）；
         <1080 单栏（detail-grid 单列） */
      body = '<div class="detail-grid mn-two-col">' +
        '<div class="detail-col-main">' + summaryHtml(data) + keypointsHtml(data) + playerHtml(data) + transcriptHtml(data) + '</div>' +
        '<div class="detail-col-side">' + todosHtml(data) + keywordsHtml(data) + metaHtml(data) +
        restructureHtml(data) + factsHtml(data) + shareHtml(data) + exportHtml(data) + deleteHtml(data) + '</div>' +
        '</div>';
    } else {
      body = '<p class="hint">未知状态：' + escapeHtml(status) + '</p>';
    }
    card.innerHTML = head + body;
    bindDetailRename(data); /* T4.43：重命名入口随刊头重建 */
    if (status === 'RETRYING' || status === 'DEAD') {
      bindCopyDiag(data); /* T4.95：复制诊断信息按钮随失败块重建 */
    }
    if (status === 'DONE') {
      bindExport(data);
      bindDelete(data);
      initTodos(data);
      bindKeywordChips(data);
      bindSummaryGround(data);
      initMeta(data);
      bindRestructure(data);
      bindShare(data);
      bindCopyTranscript(data);
      initPlayer(data);
    }
    return status === 'DONE' || status === 'DEAD';
  }

  /* ===== T4.15⑧：定位高亮——滚到对应句 + 黄 tint 短暂闪烁；只读，不改任何存储 ===== */
  function jumpToSentence(idx) {
    var el = card.querySelector('.sent-target[data-sent="' + idx + '"]');
    if (!el) return;
    card.querySelectorAll('.sent-highlight').forEach(function (n) { n.classList.remove('sent-highlight'); });
    el.classList.add('sent-highlight');

    setTimeout(function () { el.classList.remove('sent-highlight'); }, 2000);
  }

  /* ===== T4.35c：播放器——<audio> + 点句 seek + 当前句高亮 =====
   * 只读：src 走 POST /tasks/{id}/audio-token 短时签名（绝不拿 API_TOKEN 拼 src，K-46）；
   * 同一任务只签发一次，失败/过期重签一次（卡面）；segments 为 null 或 [] → 不渲染播放器（双降级，

  var player = { segs: null, audio: null, issueCount: 0, curIdx: -1 };
  var speaker = { map: null, grouped: false, menuIdx: -1, prevMap: null }; /* T4.36：说话人标注状态 */

  var PL_ICON = {

    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 12H2"/><path d="M8 6l-6 6 6 6"/><text x="15" y="15" font-size="9" fill="currentColor" stroke="none" font-weight="600">10</text></svg>',
    fwd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12h12"/><path d="M16 6l6 6-6 6"/><text x="0" y="15" font-size="9" fill="currentColor" stroke="none" font-weight="600">10</text></svg>',
    vol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>',
    mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9l6 6M22 9l-6 6"/></svg>'
  };

  function fmtTs(sec) {
    var s = Math.floor(sec);
    var m = Math.floor(s / 60);
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return pad(m) + ':' + pad(s % 60);
  }

  function playerHtml(data) {
    var segs = data.segments;
    if (!segs || !segs.length) return ''; /* null（旧任务/PASTE）与 []（空音频）都不渲染，卡面双降级 */
    player.segs = segs;
    speaker.map = data.speaker_map || null; /* T4.36：第 16 键（null=未标注/清除，不是 {}） */
    /* T4.38：自绘播放器（替换原生 controls）。竖向音量 hover/点击弹出；倍速 0.75/1/1.25/1.5；

    var rates = [0.75, 1, 1.25, 1.5].map(function (r) {
      return '<button type="button" role="menuitemradio" aria-checked="' + (r === 1) +
        '" class="' + (r === 1 ? 'on' : '') + '" data-rate="' + r + '">' + r + '×</button>';
    }).join('');
    return '<div class="section" id="playerCard"><h2>播放</h2>' +
      '<p id="playerMsg" class="hint" hidden></p>' +
      '<div id="playerBody" hidden>' +

      '<button type="button" class="pl-btn pl-play" id="plPlay" aria-label="播放">' + PL_ICON.play + '</button>' +
      '<button type="button" class="pl-btn btn-secondary" id="plBack" aria-label="后退 10 秒">' + PL_ICON.back + '</button>' +
      '<button type="button" class="pl-btn btn-secondary" id="plFwd" aria-label="前进 10 秒">' + PL_ICON.fwd + '</button>' +
      '<div class="pl-progress" id="plProgress" role="slider" tabindex="0" aria-label="播放进度"' +
      ' aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="00:00">' +
      '<div class="pl-track"><div class="pl-buf" id="plBuf"></div><div class="pl-fill" id="plFill"></div>' +
      '<div class="pl-knob" id="plKnob"></div></div>' +
      '<div class="pl-bubble" id="plBubble" hidden>00:00</div>' +
      '</div>' +
      '<span class="pl-time num" id="plTime">00:00 / 00:00</span>' +
      '<div class="pl-volume" id="plVolume">' +
      '<button type="button" class="pl-btn btn-secondary" id="plMute" aria-label="静音" aria-pressed="false">' + PL_ICON.vol + '</button>' +
      '<div class="pl-vol-pop" id="plVolPop">' +
      '<div class="pl-vol-track" id="plVolTrack" role="slider" tabindex="0" aria-label="音量（竖向）"' +
      ' aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">' +
      '<div class="pl-vol-fill" id="plVolFill"></div><div class="pl-vol-knob" id="plVolKnob"></div>' +
      '</div></div></div>' +
      '<div class="pl-speed" id="plSpeed">' +
      '<button type="button" class="pl-btn btn-secondary pl-speed-btn" id="plSpeedBtn" aria-haspopup="true"' +
      ' aria-expanded="false" aria-label="播放倍速">1×</button>' +
      '<div class="pl-speed-menu" id="plSpeedMenu" role="menu">' + rates + '</div>' +
      '</div>' +
      '</div>' +
      '<audio id="taskAudio" preload="metadata"></audio>' +
      '</div>' +
      '<p class="hint">点任意句子跳到该句；播放时当前句自动高亮。音量条 hover/点击弹出（竖向拖动），倍速在右侧。点行尾「＋标注」给句子打说话人标签。</p>' +
      '<p><button type="button" class="btn-secondary" id="speakerGroupBtn" hidden></button></p>' +
      '<div id="speakerMenu" class="speaker-menu" hidden>' +
      '<div class="speaker-menu-title" id="speakerMenuTitle"></div>' +
      '<div id="speakerMenuLabels" class="speaker-menu-labels"></div>' +
      '<div class="speaker-menu-row"><input type="text" id="speakerNewInput" maxlength="20" ' +
      'placeholder="新建标签（1–20 字）" aria-label="新建说话人标签">' +
      '<button type="button" class="btn-secondary" id="speakerNewBtn">新建</button></div>' +
      '<div class="speaker-menu-actions"><button type="button" class="btn-secondary" id="speakerClearBtn">清除本句</button>' +
      '<button type="button" class="btn-secondary" id="speakerCloseBtn">关闭</button></div>' +
      '<p id="speakerMsg" class="hint" hidden></p></div>' +
      '<ol class="seg-list" id="segList"></ol></div></div>';
      /* ↑ 最后两个 </div>：一个关 #playerBody，一个关 #playerCard section（T4.38 修复原版少一个闭合导致
         后续 section 全嵌进播放卡的问题——两栏布局下右栏会被吞进左栏，必须闭合） */
  }

  /** 单个句子行（顺序视图与分组视图共用）：seg-line（点→seek）+ seg-chip（点→说话人菜单）。 */
  function segItemHtml(i) {
    var s = player.segs[i];
    return '<li class="seg-item">' +
      '<button type="button" class="seg-line" data-idx="' + i + '" data-start="' + s.start +
      '" aria-label="跳到第 ' + (i + 1) + ' 句">' +
      '<span class="seg-ts">' + fmtTs(s.start) + '</span>' +
      '<span class="seg-text">' + escapeHtml(s.text) + '</span></button>' +
      '<button type="button" class="seg-chip" data-idx="' + i + '" aria-label="标注第 ' + (i + 1) + ' 句说话人"></button>' +
      '</li>';
  }

  function speakerLabels() {
    var seen = [], map = speaker.map || {};
    for (var k in map) {
      if (map[k] && seen.indexOf(map[k]) < 0) seen.push(map[k]);
    }
    return seen;
  }

  /** 顺序视图 ↔ 分组视图（有映射才允许分组；组序=标签首次出现序，未标注组在最后）。 */
  function renderSegList() {
    var list = document.getElementById('segList');
    if (!list) return;
    var hasMap = speaker.map && Object.keys(speaker.map).length > 0;
    if (speaker.grouped && hasMap) {
      var groups = {}, unlabeled = [], order = [], seen = {};
      for (var i = 0; i < player.segs.length; i++) {
        var lab = speaker.map[String(i)];
        if (lab) {
          if (!groups[lab]) { groups[lab] = []; order.push(lab); }
          groups[lab].push(i);
        } else {
          unlabeled.push(i);
        }
      }
      var html = '';
      order.forEach(function (l) {
        html += '<div class="seg-group"><div class="seg-group-title">' + escapeHtml(l) +
          '（' + groups[l].length + ' 句）</div>' + groups[l].map(segItemHtml).join('') + '</div>';
      });
      if (unlabeled.length) {
        html += '<div class="seg-group"><div class="seg-group-title seg-group-unlabeled">未标注（' +
          unlabeled.length + ' 句）</div>' + unlabeled.map(segItemHtml).join('') + '</div>';
      }
      list.innerHTML = html;
    } else {
      list.innerHTML = player.segs.map(function (s, i2) { return segItemHtml(i2); }).join('');
    }
    renderChips();
    updateGroupBtn();
  }

  function renderChips() {
    var list = document.getElementById('segList');
    if (!list) return;
    var map = speaker.map || {};
    list.querySelectorAll('.seg-chip').forEach(function (c) {
      var label = map[c.getAttribute('data-idx')];
      c.textContent = label || '＋标注';
      c.classList.toggle('seg-chip-active', !!label);
    });
  }

  function updateGroupBtn() {
    var btn = document.getElementById('speakerGroupBtn');
    if (!btn) return;
    var hasMap = speaker.map && Object.keys(speaker.map).length > 0;
    btn.hidden = !hasMap;
    btn.textContent = speaker.grouped ? '恢复原顺序' : '按说话人分组';
  }

  function showPlayerMsg(text) {
    var msg = document.getElementById('playerMsg');
    if (!msg) return;
    msg.hidden = !text;
    msg.className = 'error-text';
    msg.textContent = text;
  }

  function issueAudioToken() {
    player.issueCount += 1;
    postJson('api/v1/tasks/' + id + '/audio-token', {}).then(function (resp) {
      if (resp.__httpStatus === 200 && resp.url) {
        var audio = document.getElementById('taskAudio');
        audio.src = resp.url;
        player.audio = audio;
        document.getElementById('playerBody').hidden = false;
        showPlayerMsg('');
      } else if (player.issueCount < 2) {
        issueAudioToken(); /* 失败/过期重签一次（卡面） */
      } else {
        showPlayerMsg('播放不可用（' + (resp.code || resp.__httpStatus) + '）：' +
          (resp.message || '未知错误') + '。原文、摘要与导出不受影响。');
      }
    }, function () {
      if (player.issueCount < 2) {
        issueAudioToken();
      } else {
        showPlayerMsg('网络异常，播放暂时不可用。原文、摘要与导出不受影响。');
      }
    });
  }

  /** 当前句：start<=t<end 命中即返回；句间隙取最近前一句（卡面口径）；t 在首句之前 → -1。 */
  function currentSegIndex(t) {
    var cur = -1;
    for (var i = 0; i < player.segs.length; i++) {
      if (player.segs[i].start <= t) {
        cur = i;
        if (t < player.segs[i].end) return i;
      } else {
        break;
      }
    }
    return cur;
  }

  function highlightSeg(idx, force) {
    if (!force && idx === player.curIdx) return;
    player.curIdx = idx;
    var list = document.getElementById('segList');
    if (!list) return;
    list.querySelectorAll('.seg-current').forEach(function (n) { n.classList.remove('seg-current'); });
    if (idx < 0) return;
    var line = list.querySelector('.seg-line[data-idx="' + idx + '"]');
    if (line) {
      line.classList.add('seg-current');
      line.scrollIntoView({ block: 'nearest' }); /* 不抢用户滚动：nearest 只在出视野时贴边 */
    }
  }

  function initPlayer(data) {
    if (!player.segs) return; /* null/[]：双降级，页面无 <audio> 元素，也无说话人 UI（T4.36） */
    renderSegList();
    bindSpeakerMenu();
    issueAudioToken();
    var audio = document.getElementById('taskAudio');
    initPlayerChrome(audio); /* T4.38：自绘播放器（播放/±10s/拖动进度/竖音量/倍速） */
    /* 播放中签名过期（audio 加载 404）→ 重签一次 */
    audio.addEventListener('error', function () {
      if (player.issueCount < 2) {
        var wasPlaying = !audio.paused;
        issueAudioToken();
        var timer = setInterval(function () {
          var fresh = document.getElementById('taskAudio');
          if (fresh && fresh.readyState >= 1) {
            clearInterval(timer);
            if (wasPlaying) fresh.play();
          }
        }, 300);
      }
    });
    /* 点句 → seek（用户手势内同时 play）；K-80 写路径口径：真点真读 audio.currentTime。
     * 事件委托绑在 segList 元素上（innerHTML 重渲染不丢）；seg-chip 与 seg-line 是兄弟节点，
     * chip 点击不会触发 seek。 */
    document.getElementById('segList').addEventListener('click', function (ev) {
      var line = ev.target.closest('.seg-line');
      if (!line || !player.audio) return;
      var start = parseFloat(line.getAttribute('data-start'));
      if (isNaN(start)) return;
      player.audio.currentTime = start;
      player.audio.play();
    });
    /* timeupdate → 当前句高亮跟随（间隙用最近前一句）；只在句切换时滚动，不抢用户滚动 */
    audio.addEventListener('timeupdate', function () {
      highlightSeg(currentSegIndex(audio.currentTime));
    });
    audio.addEventListener('seeked', function () {
      highlightSeg(currentSegIndex(audio.currentTime), true);
    });
  }

  /* ===== T4.38：自绘播放器 UI（替换原生 controls；保留 T4.35c 全部行为） =====
   * 播放/暂停、±10s、可拖进度条（缓冲 + hover 时间气泡）、tabular-nums 时间、
   * 竖向音量（hover/点击弹出，拖动实时 audio.volume，静音切换、键盘可调）、倍速 0.75/1/1.25/1.5。
   * ARIA role=slider + aria-valuenow；键盘：进度 ←/→ ±5s、音量 ↑/↓ ±0.1。 */
  function initPlayerChrome(audio) {
    var playBtn = document.getElementById('plPlay');
    var backBtn = document.getElementById('plBack');
    var fwdBtn = document.getElementById('plFwd');
    var progress = document.getElementById('plProgress');
    var track = progress ? progress.querySelector('.pl-track') : null;
    var fill = document.getElementById('plFill');
    var buf = document.getElementById('plBuf');
    var knob = document.getElementById('plKnob');
    var bubble = document.getElementById('plBubble');
    var timeEl = document.getElementById('plTime');
    var volWrap = document.getElementById('plVolume');
    var muteBtn = document.getElementById('plMute');
    var volTrack = document.getElementById('plVolTrack');
    var volFill = document.getElementById('plVolFill');
    var volKnob = document.getElementById('plVolKnob');
    var speedWrap = document.getElementById('plSpeed');
    var speedBtn = document.getElementById('plSpeedBtn');
    var speedMenu = document.getElementById('plSpeedMenu');
    if (!progress || !track) return;
    var dur = 0;
    var RATES = [0.75, 1, 1.25, 1.5];

    function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

    function renderTime() {
      timeEl.textContent = fmtTs(audio.currentTime || 0) + ' / ' + fmtTs(dur || 0);
    }
    function renderProgress() {
      var pct = dur ? clamp((audio.currentTime || 0) / dur * 100, 0, 100) : 0;
      fill.style.width = pct + '%';
      knob.style.left = pct + '%';
      progress.setAttribute('aria-valuenow', String(Math.round(pct)));
      progress.setAttribute('aria-valuetext', fmtTs(audio.currentTime || 0));
      renderTime();
    }
    function renderBuf() {
      try {
        if (audio.buffered.length && dur) {
          var end = audio.buffered.end(audio.buffered.length - 1);
          buf.style.width = clamp(end / dur * 100, 0, 100) + '%';
        }
      } catch (e) { /* buffered 不可用忽略 */ }
    }
    function renderVolume() {
      var v = audio.muted ? 0 : audio.volume;
      volFill.style.height = (v * 100) + '%';
      volKnob.style.bottom = (v * 100) + '%';
      volTrack.setAttribute('aria-valuenow', String(Math.round(v * 100)));
      var muted = audio.muted || audio.volume === 0;
      muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
      muteBtn.setAttribute('aria-label', muted ? '取消静音' : '静音');
      muteBtn.innerHTML = muted ? PL_ICON.mute : PL_ICON.vol;
    }
    function renderSpeed() {
      speedMenu.querySelectorAll('button[data-rate]').forEach(function (b) {
        var on = Math.abs(audio.playbackRate - parseFloat(b.getAttribute('data-rate'))) < 0.01;
        b.classList.toggle('on', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
      speedBtn.textContent = audio.playbackRate + '×';
    }

    playBtn.addEventListener('click', function () {
      if (audio.paused) audio.play(); else audio.pause();
    });
    audio.addEventListener('play', function () {
      playBtn.innerHTML = PL_ICON.pause;
      playBtn.setAttribute('aria-label', '暂停');
    });
    audio.addEventListener('pause', function () {
      playBtn.innerHTML = PL_ICON.play;
      playBtn.setAttribute('aria-label', '播放');
    });
    backBtn.addEventListener('click', function () {
      audio.currentTime = clamp((audio.currentTime || 0) - 10, 0, dur || audio.duration || 0);
    });
    fwdBtn.addEventListener('click', function () {
      audio.currentTime = clamp((audio.currentTime || 0) + 10, 0, dur || audio.duration || 1e9);
    });

    audio.addEventListener('timeupdate', renderProgress);
    audio.addEventListener('progress', renderBuf);
    function onMeta() { dur = isFinite(audio.duration) ? audio.duration : 0; progress.setAttribute('aria-valuemax', String(Math.round(dur || 0))); renderProgress(); renderBuf(); }
    audio.addEventListener('loadedmetadata', onMeta);
    audio.addEventListener('durationchange', onMeta);

    /* 进度拖动（pointer events 统一鼠标/触控） */
    var seeking = false;
    function seekFromClientX(clientX) {
      if (!dur) return;
      var rect = track.getBoundingClientRect();
      var x = clamp((clientX - rect.left) / rect.width, 0, 1);
      audio.currentTime = x * dur;
    }
    progress.addEventListener('pointerdown', function (e) {
      if (!dur) return;
      seeking = true;
      try { progress.setPointerCapture(e.pointerId); } catch (err) { /* 旧浏览器忽略 */ }
      seekFromClientX(e.clientX);
      e.preventDefault();
    });
    progress.addEventListener('pointermove', function (e) { if (seeking) seekFromClientX(e.clientX); });
    function endSeek() { seeking = false; }
    progress.addEventListener('pointerup', endSeek);
    progress.addEventListener('pointercancel', endSeek);
    progress.addEventListener('lostpointercapture', endSeek);
    /* hover 时间气泡 */
    progress.addEventListener('mousemove', function (e) {
      if (!dur) return;
      var rect = track.getBoundingClientRect();
      var x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
      bubble.hidden = false;
      bubble.style.left = (x * 100) + '%';
      bubble.textContent = fmtTs(x * dur);
    });
    progress.addEventListener('mouseleave', function () { bubble.hidden = true; });
    progress.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { audio.currentTime = clamp((audio.currentTime || 0) - 5, 0, dur || 0); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { audio.currentTime = clamp((audio.currentTime || 0) + 5, 0, dur || 1e9); e.preventDefault(); }
    });

    /* 竖向音量：hover（桌面）/点击（含 390 触屏）弹出；拖动实时改 audio.volume */
    var volDragging = false;
    function volFromClientY(clientY) {
      var rect = volTrack.getBoundingClientRect();
      var y = 1 - (clientY - rect.top) / rect.height;
      audio.volume = clamp(y, 0, 1);
      audio.muted = false;
      if (audio.volume > 0) player.lastVol = audio.volume;
    }
    volTrack.addEventListener('pointerdown', function (e) {
      volDragging = true;
      try { volTrack.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      volFromClientY(e.clientY);
      e.preventDefault();
    });
    volTrack.addEventListener('pointermove', function (e) { if (volDragging) volFromClientY(e.clientY); });
    function endVolDrag() { volDragging = false; }
    volTrack.addEventListener('pointerup', endVolDrag);
    volTrack.addEventListener('pointercancel', endVolDrag);
    volTrack.addEventListener('lostpointercapture', endVolDrag);
    volTrack.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp') { audio.muted = false; audio.volume = clamp(audio.volume + 0.1, 0, 1); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { audio.volume = clamp(audio.volume - 0.1, 0, 1); e.preventDefault(); }
    });
    muteBtn.addEventListener('click', function () {
      if (audio.muted || audio.volume === 0) {
        audio.muted = false;
        if (audio.volume === 0) audio.volume = player.lastVol || 1;
      } else {
        player.lastVol = audio.volume;
        audio.muted = true;
      }
      /* Chromium 对 muted 变更不派发 volumechange：显式同步 UI（aria-pressed/图标/填充条） */
      renderVolume();
      /* 390 触屏无 hover：点静音钮同时弹出竖向音量（用户可直接拖），外点收起 */
      volWrap.classList.add('open');
    });
    /* 点击音量容器（非按钮）钉住弹层；鼠标移出/点外收起 */
    volWrap.addEventListener('click', function (e) {
      if (e.target.closest('#plMute') || e.target.closest('#plVolTrack')) return;
      volWrap.classList.toggle('open');
    });
    document.addEventListener('click', function (e) {
      if (!volWrap.contains(e.target)) volWrap.classList.remove('open');
    });
    volWrap.addEventListener('mouseleave', function () { volWrap.classList.remove('open'); });

    /* 倍速菜单 */
    audio.addEventListener('ratechange', renderSpeed); /* T4.41：速率变化（含菜单外途径）同步按钮文案与菜单选中态 */
    speedBtn.addEventListener('click', function () {
      var open = speedWrap.classList.toggle('open');
      speedBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    speedMenu.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-rate]');
      if (!b) return;
      audio.playbackRate = parseFloat(b.getAttribute('data-rate'));
      speedWrap.classList.remove('open');
      speedBtn.setAttribute('aria-expanded', 'false');
    });
    /* ESC 先收播放器弹层（抽屉的 ESC 关闭由父页处理） */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (speedWrap.classList.contains('open')) {
        speedWrap.classList.remove('open');
        speedBtn.setAttribute('aria-expanded', 'false');
      } else if (volWrap.classList.contains('open')) {
        volWrap.classList.remove('open');
      }
    });

    renderProgress();
    renderVolume();
    renderSpeed();
  }

  /* ===== T4.36：说话人标注菜单（选已有 / 新建 / 清除 → PATCH → 回读详情，K-80；失败就地提示回滚） ===== */

  function bindSpeakerMenu() {
    var menu = document.getElementById('speakerMenu');
    if (!menu) return;
    menu.addEventListener('click', function (ev) { ev.stopPropagation(); });
    document.getElementById('speakerCloseBtn').addEventListener('click', closeSpeakerMenu);
    document.getElementById('speakerGroupBtn').addEventListener('click', function () {
      speaker.grouped = !speaker.grouped;
      renderSegList();
    });
    document.getElementById('segList').addEventListener('click', function (ev) {
      var chip = ev.target.closest('.seg-chip');
      if (!chip) return;
      openSpeakerMenu(Number(chip.getAttribute('data-idx')));
    });
    document.getElementById('speakerNewBtn').addEventListener('click', function () {
      var input = document.getElementById('speakerNewInput');
      var label = input.value.trim();
      if (!label) { showSpeakerMsg('请输入 1–20 字的标签'); return; }
      applyLabel(label);
    });
    document.getElementById('speakerNewInput').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') document.getElementById('speakerNewBtn').click();
    });
    document.getElementById('speakerClearBtn').addEventListener('click', function () {
      applyLabel(null);
    });
  }

  function openSpeakerMenu(idx) {
    speaker.menuIdx = idx;
    speaker.prevMap = speaker.map ? JSON.parse(JSON.stringify(speaker.map)) : null; /* 失败回滚基准 */
    var menu = document.getElementById('speakerMenu');
    var map = speaker.map || {};
    document.getElementById('speakerMenuTitle').textContent =
      '第 ' + (idx + 1) + ' 句说话人 · 当前：' + (map[String(idx)] || '未标注');
    var labels = speakerLabels();
    var box = document.getElementById('speakerMenuLabels');
    box.innerHTML = labels.length
      ? labels.map(function (l) {
          return '<button type="button" class="btn-secondary speaker-pick' +
            (map[String(idx)] === l ? ' speaker-pick-on' : '') + '" data-label="' +
            escapeHtml(l).replace(/"/g, '&quot;') + '">' + escapeHtml(l) + '</button>';
        }).join('')
      : '<span class="hint">还没有标签，用下面输入框新建一个</span>';
    box.querySelectorAll('.speaker-pick').forEach(function (b) {
      b.addEventListener('click', function () { applyLabel(b.getAttribute('data-label')); });
    });
    document.getElementById('speakerNewInput').value = '';
    document.getElementById('speakerMsg').hidden = true;
    menu.hidden = false;
    document.getElementById('speakerNewInput').focus();
  }

  function closeSpeakerMenu() {
    var menu = document.getElementById('speakerMenu');
    if (menu) menu.hidden = true;
    speaker.menuIdx = -1;
  }

  function showSpeakerMsg(text) {
    var el = document.getElementById('speakerMsg');
    if (!el) return;
    el.hidden = !text;
    el.className = 'error-text';
    el.textContent = text;
  }

  /** 应用标签（label=null 清除）：构建候选 map → PATCH → 成功后回读详情（K-80）；失败就地提示。 */
  function applyLabel(label) {
    var idx = speaker.menuIdx;
    if (idx < 0) return;
    var candidate = speaker.map ? JSON.parse(JSON.stringify(speaker.map)) : {};
    if (label === null) {
      delete candidate[String(idx)];
    } else {
      candidate[String(idx)] = label;
    }
    sendJson('api/v1/tasks/' + id + '/speaker-map', 'PATCH', { speaker_map: candidate })
      .then(function (resp) {
        if (resp.__httpStatus !== 200) {
          showSpeakerMsg('保存失败（' + (resp.code || resp.__httpStatus) + '）：' +
            (resp.message || '请稍后重试')); /* map 未动 = 自然回滚 */
          return;
        }
        /* K-80：PATCH 成功后回读详情，以服务端为准更新本地状态 */
        getJson('api/v1/tasks/' + id).then(function (detail) {
          speaker.map = detail && detail.speaker_map ? detail.speaker_map : null;
          closeSpeakerMenu();
          renderSegList();
        }, function () {
          /* 回读失败也用响应值兜底（已落库，仅展示层保守） */
          speaker.map = Object.keys(resp.speaker_map || {}).length ? resp.speaker_map : null;
          closeSpeakerMenu();
          renderSegList();
        });
      }, function () {
        showSpeakerMsg('网络异常，保存失败。标签未变更。');
      });
  }


  /* T4.15⑨：待办渲染与交互（checkbox → PATCH {done}；删除 → DELETE；乐观更新 + 失败回滚 + 行内错误） */
  var todos = [];

  function todoGroundHtml(action) {
    var hit = mnGroundSentence(action, transcript);
    if (hit) {
      return '<div class="todo-ground">依据 · 在原文中匹配到的句子：<button type="button" class="ground-link" data-sent="' +
        hit.index + '">「' + escapeHtml(hit.sentence.length > 60 ? hit.sentence.slice(0, 60) + '…' : hit.sentence) + '」</button></div>';
    }
    return '<div class="todo-ground">依据 · <span class="ground-miss">未找到直接依据</span></div>';
  }

  function renderTodoList() {
    var listEl = document.getElementById('todoList');
    if (!listEl || !todos.length) return;
    listEl.innerHTML = todos.map(function (t, i) {
      var meta = [];
      meta.push('负责人：' + (t.owner || '未指定'));
      meta.push('截止：' + (t.deadline || '未指定'));
      return '<div class="todo-item">' +
        '<div class="todo-row">' +
        '<input type="checkbox" class="todo-check" data-index="' + i + '"' + (t.done ? ' checked' : '') +
        ' aria-label="标记待办完成状态">' +
        '<div class="todo-main' + (t.done ? ' done' : '') + '">' +
        '<div class="todo-action-text">' + escapeHtml(t.action || '') + '</div>' +
        '<div class="todo-meta">' + meta.join(' · ') + '</div>' +
        todoGroundHtml(t.action) +
        '</div>' +
        '<div class="todo-actions"><button type="button" class="todo-del" data-index="' + i + '">删除</button></div>' +
        '</div></div>';
    }).join('');
    listEl.querySelectorAll('.todo-check').forEach(function (box) {
      box.addEventListener('change', function () {
        var idx = Number(box.getAttribute('data-index'));
        var prev = todos[idx].done;
        todos[idx].done = box.checked; /* 乐观更新 */
        renderTodoList();
        sendJson('api/v1/tasks/' + id + '/todos/' + idx, 'PATCH', { done: box.checked }).then(function (data) {
          if (data.__httpStatus !== 200) {
            todos[idx] && (todos[idx].done = prev); /* 失败回滚 */
            renderTodoList();
            todoMsgShow('更新失败（' + (data.code || 'HTTP ' + data.__httpStatus) + '）：' + (data.message || '请稍后重试'));
          } else {
            todos[idx] && (todos[idx] = data.todo); /* 以服务端返回为准（幂等写，D-072 口径不动） */
            renderTodoList();
          }
        });
      });
    });
    listEl.querySelectorAll('.todo-del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-index'));
        var removed = todos.splice(idx, 1); /* 乐观移除；DELETE 非幂等（后续 index 移位），本地数组与服务端保持同步 */
        renderTodoList();
        sendJson('api/v1/tasks/' + id + '/todos/' + idx, 'DELETE').then(function (data) {
          if (data.__httpStatus !== 200) {
            todos.splice(idx, 0, removed[0]); /* 失败回滚 */
            renderTodoList();
            todoMsgShow('删除失败（' + (data.code || 'HTTP ' + data.__httpStatus) + '）：' + (data.message || '请稍后重试'));
          }
        });
      });
    });
    listEl.querySelectorAll('.ground-link').forEach(function (a) {
      a.addEventListener('click', function () {
        jumpToSentence(Number(a.getAttribute('data-sent')));
      });
    });
  }

  function todoMsgShow(text) {
    var el = document.getElementById('todoMsg');
    if (!el) return;
    el.textContent = text;
    el.hidden = false;
  }

  function initTodos(data) {
    todos = Array.isArray(data.todos) ? data.todos.map(function (t) {
      return { action: t.action, owner: t.owner, deadline: t.deadline, done: !!t.done };
    }) : [];
    renderTodoList();
  }

  /* T4.15⑧：关键词点击定位（chip 在 summaryHtml 里按命中与否设置 linkable） */
  function bindKeywordChips() {
    card.querySelectorAll('.chip.linkable').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var hit = mnGroundKeyword(chip.getAttribute('data-keyword'), transcript);
        if (hit) jumpToSentence(hit.index);
      });
    });
  }

  /* T4.23：摘要依据行点击 → 滚到逐字稿对应句并高亮（复用 jumpToSentence / data-sent 机制） */
  function bindSummaryGround() {
    card.querySelectorAll('.summary-ground .ground-link').forEach(function (a) {
      a.addEventListener('click', function () {
        jumpToSentence(Number(a.getAttribute('data-sent')));
      });
    });
  }

  /* T4.15⑨：复制全文（clipboard + textarea 兜底 + 「已复制」提示） */
  function bindCopyTranscript() {
    var btn = document.getElementById('copyTranscriptBtn');
    var hint = document.getElementById('copiedHint');
    if (!btn) return;
    btn.addEventListener('click', function () {
      mnCopyText(displayText || transcript, function () {
        hint.hidden = false;
        hint.textContent = '已复制';
        setTimeout(function () { hint.hidden = true; }, 2000);
      }, function () {
        hint.hidden = false;
        hint.textContent = '复制失败';
        setTimeout(function () { hint.hidden = true; }, 2000);
      });
    });
  }

  /* 档案抬头行日期（T4.41） */
  (function () {
    var el = document.getElementById('docketDate');
    if (!el) return;
    var d = new Date();
    var p = function (n) { return n < 10 ? '0' + n : String(n); };
    el.textContent = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  })();

  /* PENDING/RUNNING/RETRYING 每 3 秒轮询（D-024），到 DONE/DEAD 或 404 停 */
  pollUntil('api/v1/tasks/' + id, render, render);
})();
</script>
