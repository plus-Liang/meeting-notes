# 发布镜像：打 tag（v*）自动构建 app / asr 并推送 GHCR（T4.11b）
#
# 说明：
# - 镜像不含 ASR 模型（模型 461 MB 由 first-run / download-model 首次下载到宿主 ./models）
# - ghcr 命名空间必须全小写（仓库 owner 是 plus-Liang）→ 镜像名写死 plus-liang

name: Release Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: ./app
          - name: asr
            context: ./infra/asr
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/plus-liang/meeting-notes-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/plus-liang/meeting-notes-${{ matrix.name }}:latest
