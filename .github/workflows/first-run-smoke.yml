# first-run-smoke（T4.18）—— 三系统上验证引导脚本的静态行为与幂等性。
# 纪律：只做静态校验——不 docker compose up、不下载模型（461MB 不许进 CI）、不改现有 ci.yml。
# ① 语法/静态：Linux/macOS 用 bash -n 检 first-run.sh；Windows 用 PS 5.1 [Parser]::ParseFile
#    检 scripts/*.ps1 并校验 UTF-8 BOM（239,187,191，无 BOM 时 PS 5.1 按 ANSI 读中文会炸，K-101 系列）。
# ② docker compose config -q 只校验 compose 插值，不起栈；macos-latest 无 docker CLI 时打印 SKIP
#    并继续（如实留痕，不谎报通过）。
name: first-run-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: bash -n first-run.sh（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/first-run.sh
          echo "bash -n scripts/first-run.sh OK"

      - name: PS 5.1 语法 + UTF-8 BOM 校验（Windows）
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = Get-ChildItem scripts/*.ps1
          if (-not $files) { throw "scripts 下未找到 .ps1" }
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("语法错误: " + $f.Name + " -> " + $errors[0].Message) }
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($b[0] -ne 239 -or $b[1] -ne 187 -or $b[2] -ne 191) {
              throw ("缺 UTF-8 BOM（首字节应为 239,187,191）: " + $f.Name)
            }
            Write-Host ("checked " + $f.Name + " : 语法 OK + BOM OK")
          }

      - name: docker compose config -q（只校验插值，不起栈）
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker compose -f docker-compose.yml config -q && echo "compose config -q OK"
          else
            echo "SKIP: 此 runner 无 docker CLI（macos-latest），compose 插值校验仅在 ubuntu/windows 执行"
          fi

      # Windows 的 config 校验与 Linux 同源（docker CLI 客户端即可，无需守护进程）
      - name: docker compose config -q（Windows）
        if: runner.os == 'Windows'
        shell: cmd
        run: docker compose -f docker-compose.yml config -q && echo compose config -q OK

      - name: report
        shell: bash
        run: echo "OK first-run-smoke @ ${{ runner.os }}"
