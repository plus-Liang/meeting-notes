# CI：push / PR 自动触发（T4.11b）
#
# runner 上没有 Docker 基础栈（无数据库/Redis/MinIO），E2E 用例依赖真实栈，
# 所以这里只跑单元层（排除 E2ETest）+ Compose 配置校验；全量 511 用例在本地/发布机上跑。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests (exclude E2E/冒烟 — 需要真实栈，与 scripts/test.ps1 -UnitOnly 口径一致)
        working-directory: app
        run: mvn -B -q test -Dtest='!E2ETest,!AsrSmokeTest,!LlmSmokeTest'

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config -q
