<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向对比 — 录音纪要平台前端方向探索</title>
<style>
:root{--bg:#0f1113;--panel:#16191c;--line:#2a2f33;--ink:#e9ecea;--ink-2:#a7b0ad;--accent:#e8b04b;
  --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--sans);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:14px;letter-spacing:.02em}
header .hint{font:400 11px/1.5 var(--mono);color:var(--ink-2)}
.sw{display:flex;gap:0;margin-left:auto;border:1px solid var(--line)}
.sw button{background:transparent;border:0;border-right:1px solid var(--line);color:var(--ink-2);cursor:pointer;
  padding:9px 16px;font:500 12px/1 var(--sans);transition:.15s}
.sw button:last-child{border-right:0}
.sw button:hover{background:#1d2226;color:var(--ink)}
.sw button[aria-pressed="true"]{background:var(--accent);color:#141414;font-weight:600}
.sw a{padding:9px 14px;font:400 11px/1 var(--mono);color:var(--ink-2);text-decoration:none;border-right:1px solid var(--line)}
.sw a:hover{color:var(--ink);background:#1d2226}
.wrap{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:12px;min-height:0}
.card{border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);min-height:0}
.card.on{outline:2px solid var(--accent);outline-offset:0}
.card .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:#12151700}
.card .bar b{font:600 12px/1.4 var(--sans)}
.card .bar span{font:400 10px/1.4 var(--mono);color:var(--ink-2)}
.card .bar button{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--ink-2);cursor:pointer;
  font:400 10px/1 var(--mono);padding:5px 9px;border-radius:2px}
.card .bar button:hover{color:var(--ink);border-color:#3c4448}
.card iframe{flex:1;width:100%;border:0;background:#fff;min-height:0}
.solo{position:fixed;inset:0;display:none;background:#000;z-index:9;flex-direction:column}
.solo.on{display:flex}
.solo .close{position:absolute;right:14px;top:12px;z-index:2;background:#000c;color:#fff;border:1px solid #ffffff33;
  padding:8px 12px;font:400 11px/1 var(--mono);cursor:pointer}
.solo iframe{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body>
<header>
  <b>前端方向探索 · 3 版</b>
  <span class="hint">真浏览器可交互 · 真实数据样例 · 都遵守：离线自托管 / 衬线标题+黑体正文+等宽数字 / 克制动效</span>
  <div class="sw">
    <button data-cols="1" aria-pressed="false">单栏</button>
    <button data-cols="3" aria-pressed="true">并排</button>
    <a href="direction-a-swiss.html" target="_blank">A 白纸瑞士 ↗</a>
    <a href="direction-b-archive.html" target="_blank">B 暖纸档案 ↗</a>
    <a href="direction-c-instrument.html" target="_blank">C 灰版仪器 ↗</a>
  </div>
</header>

<div class="wrap" id="wrap">
  <div class="card" data-src="direction-a-swiss.html">
    <div class="bar"><b>A · 白纸瑞士</b><span>网格硬结构 / 零卡片 / 朱红点击</span><button data-solo>全屏</button></div>
    <iframe src="direction-a-swiss.html" title="方向 A"></iframe>
  </div>
  <div class="card" data-src="direction-b-archive.html">
    <div class="bar"><b>B · 暖纸档案</b><span>文件抬头 / 台账行 / 印章红</span><button data-solo>全屏</button></div>
    <iframe src="direction-b-archive.html" title="方向 B"></iframe>
  </div>
  <div class="card" data-src="direction-c-instrument.html">
    <div class="bar"><b>C · 灰版仪器</b><span>密排表格 / 读数栏 / 群青信号</span><button data-solo>全屏</button></div>
    <iframe src="direction-c-instrument.html" title="方向 C"></iframe>
  </div>
</div>

<div class="solo" id="solo">
  <button class="close" id="closeSolo">关闭 ✕</button>
  <iframe id="soloFrame" title="全屏预览"></iframe>
</div>

<script>
const wrap = document.getElementById('wrap');
document.querySelectorAll('.sw button[data-cols]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.sw button[data-cols]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const n = Number(b.dataset.cols);
    wrap.style.gridTemplateColumns = n === 1 ? '1fr' : '1fr 1fr 1fr';
    document.querySelectorAll('.card').forEach((c, i) => { c.style.display = (n === 1 && i > 0) ? 'none' : 'flex'; });
  });
});
const solo = document.getElementById('solo'), sf = document.getElementById('soloFrame');
document.querySelectorAll('[data-solo]').forEach(btn => {
  btn.addEventListener('click', () => {
    sf.src = btn.closest('.card').dataset.src;
    solo.classList.add('on');
  });
});
document.getElementById('closeSolo').addEventListener('click', () => { solo.classList.remove('on'); sf.src = 'about:blank'; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { solo.classList.remove('on'); sf.src = 'about:blank'; } });
</script>
</body>
</html>
