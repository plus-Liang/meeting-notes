# 预构建镜像 override（T4.11b）：不想本地构建时，用 GHCR 拉好的镜像直接起栈。
#
# 用法（在仓库根）：
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# - 指定版本：设 MEETING_NOTES_TAG=v0.1.0（默认 latest）
# - ⚠️ 镜像不含 ASR 模型（461 MB）：首次启动仍需跑 scripts/download-model.ps1 下载到 ./models
# - 私有仓库/首次发布后未设 Public 时，先 docker login ghcr.io（见 README FAQ）
#
# 主 docker-compose.yml 保持本地构建路径不变（陌生人默认路径不受影响）。

services:
  app:
    image: ghcr.io/plus-liang/meeting-notes-app:${MEETING_NOTES_TAG:-latest}
    build: !reset null

  asr:
    image: ghcr.io/plus-liang/meeting-notes-asr:${MEETING_NOTES_TAG:-latest}
    build: !reset null
